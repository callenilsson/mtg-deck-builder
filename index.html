<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="build" content="20261119223119">
<title>MTG Deck Builder</title>
<!-- Home Screen app: iPhone opens it without Safari's bars -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deck Builder">
<meta name="theme-color" content="#10121b">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Android / Chrome: lets the site be installed as an app (opens without the browser bar) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.17.0/css/mana.min.css">
<link rel="stylesheet" href="css/base.css?v=20261119223119">
<link rel="stylesheet" href="css/sidebar.css?v=20261119223119">
<link rel="stylesheet" href="css/buttons.css?v=20261119223119">
<link rel="stylesheet" href="css/header.css?v=20261119223119">
<link rel="stylesheet" href="css/stats.css?v=20261119223119">
<link rel="stylesheet" href="css/test-hand.css?v=20261119223119">
<link rel="stylesheet" href="css/stats-charts.css?v=20261119223119">
<link rel="stylesheet" href="css/toolbar.css?v=20261119223119">
<link rel="stylesheet" href="css/board.css?v=20261119223119">
<link rel="stylesheet" href="css/modals.css?v=20261119223119">
<link rel="stylesheet" href="css/card-view.css?v=20261119223119">
<link rel="stylesheet" href="css/dialogs.css?v=20261119223119">
<link rel="stylesheet" href="css/responsive.css?v=20261119223119">
<link rel="stylesheet" href="css/commander-panel.css?v=20261119223119">
<link rel="stylesheet" href="css/interface-size.css?v=20261119223119">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="Your decks">
    <div class="side-head">
      <div class="brand"><i class="ms ms-commander"></i>MTG Deck Builder</div>
      <button class="icon-btn panel-btn" id="closeSide" title="Collapse the deck list"></button>
    </div>
    <div class="side-rail" id="sideRail"><button class="icon-btn panel-btn" id="railExpand" title="Show the deck list"></button><span class="rail-brand" title="MTG Deck Builder"><i class="ms ms-commander"></i></span><span id="railMe"></span><div class="rail-decks" id="railDecks"></div></div>
    <div class="profile" id="profile"></div>
        <div id="deckList"></div>
    <div class="side-foot">


      <div class="drive-box" id="driveBox"></div>
      <details class="backup" id="backupBox"><summary>Backup &amp; import</summary>
        <div class="backup-body">
      <button class="btn" id="saveFile" title="Download a file with all your decks, as a backup or to send to someone"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Download backup<span class="unsaved-dot" id="unsavedDot" hidden></span></button>
      <button class="btn" id="importBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>Import decks from a file</button>
      <input type="file" id="importFile" accept=".html,.htm,.json,.txt" hidden>
      <div class="side-note">Decks save to Google Drive automatically. Use these to keep an extra backup, or to bring in decks from an old file.</div>
        </div></details>
    </div>
    <div class="pane-grip" id="sideGrip" title="Drag to resize. Double-click to reset." aria-hidden="true"></div>
  </aside>
  <div id="sideScrim"></div>

  <div id="main">
    <header id="top">
      <div id="rail"></div>
      <div class="cmds" id="cmds"></div>
      <div class="name-row">
        <button class="icon-btn" id="openSide" title="Show or hide your decks"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <label class="name-wrap" title="Click to rename this deck"><input id="deckName" placeholder="Name your deck" aria-label="Deck name" autocomplete="off"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></label>
        <div class="top-actions">
          <button class="card-plus-btn" id="addAny" title="Add cards: EDHREC picks for your commander, or search any card"><span class="card-plus-ico">+</span><span class="label-wide">Add cards</span><span class="label-s">Add</span></button>
          <button class="btn" id="drawHandTop" data-drawhand title="Deal a random opening hand from this deck and play a few turns"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="9" height="13" rx="1.5" transform="rotate(-12 7.5 12.5)"/><rect x="9" y="4" width="9" height="13" rx="1.5"/><path d="M13.5 8.5v4M11.5 10.5h4"/></svg><span class="label">Test hand</span><span class="label-s">Test</span></button>
          
          <button class="btn phone-only" id="statsBtn" title="Deck stats and odds"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="label">Stats</span></button>
          <button class="btn" id="pdfBtn" title="Preview and print proxies at real card size"><svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg><span class="label">Print</span></button>
          <button class="icon-btn fold-btn panel-btn" id="foldTop" title="Collapse this panel to show more cards"></button>
        </div>
      </div>
      <div class="ro-banner" id="roBanner" hidden></div>
      <div class="combo" id="combo"></div>
      <div id="stats"></div>
      <div id="total"></div>
    </header>
    <div class="pane-grip" id="topGrip" title="Drag to resize. Double-click to reset." aria-hidden="true"></div>

    <div id="tools" hidden>
      <button class="tool fs-btn" id="fsBtn" hidden></button>
      <div class="tool size" title="Card size on this screen. Double-click the number to reset."><span class="tl">Card size</span><span class="tl-ico z-ico" aria-hidden="true"></span><button class="pm" data-zstep="-5" aria-label="Smaller cards">−</button><input type="range" id="zoom" min="20" max="400" step="5" value="100" aria-label="Card size"><button class="pm" data-zstep="5" aria-label="Bigger cards">+</button><output id="zoomVal">100%</output></div>
      <div class="tool size ui" title="Size of menus, text and buttons (not the cards). Double-click the number to reset."><span class="tl">Interface</span><span class="tl-ico a-ico" aria-hidden="true">Aa</span><button class="pm" data-ustep="-5" aria-label="Smaller interface">−</button><output id="uiZoomVal">100%</output><button class="pm" data-ustep="5" aria-label="Bigger interface">+</button></div>
      <label class="tool"><span class="tl">Sort</span><select id="sortSel">
        <option value="manual">Your order</option><option value="incl">% of decks (EDHREC)</option><option value="syn">Synergy (EDHREC)</option>
        <option value="price">Price, high to low</option><option value="cheap">Price, low to high</option><option value="cmc">Mana value</option>
        <option value="ctype">Creature type</option><option value="name">Name</option></select></label>
      <div class="tool filter" id="filterBox"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="filterQ" type="search" placeholder="Filter cards" autocomplete="off" aria-label="Filter cards by name, type or rules text"><select id="ctypeSel" aria-label="Creature type"></select></div>
      <span class="tools-gap"></span>
      <div class="tool moves"><span class="tl opt">Move all</span><button class="btn" id="allToPool" title="Move every unlocked deck card to the card pool">← To pool</button><button class="btn" id="allToDeck" title="Move every card pool card to the deck">To deck →</button></div>
    </div>

    <div id="welcome" hidden></div>

    <section id="board">
      <div class="panel" data-zone="options">
        <div class="panel-scroll">
          <div class="panel-head"><h2>Card pool</h2><span class="ph-meta" id="optMeta"></span><nav class="jump" id="optJump" aria-label="Jump to a type"></nav></div>
          <div id="optBoxes"></div>
        </div>
      </div>
      <div class="splitter" id="splitter" title="Drag to resize. Double-click to center."><i></i></div>
      <div class="panel" data-zone="deck">
        <div class="panel-scroll">
          <div class="panel-head"><h2>Deck</h2><span class="ph-meta" id="deckMeta"></span><button class="ph-btn" id="drawHand" title="Test draw: deal a random opening hand from this deck, then draw and mulligan"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="9" height="13" rx="1.5" transform="rotate(-12 7.5 12.5)"/><rect x="9" y="4" width="9" height="13" rx="1.5"/><path d="M13.5 8.5v4M11.5 10.5h4"/></svg><span>Test hand</span></button><nav class="jump" id="deckJump" aria-label="Jump to a type"></nav></div>
          <div id="deckBoxes"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<img id="hoverPrev" alt="" hidden>
<div class="scrim" id="addScrim" hidden><div class="modal" id="addModal" role="dialog" aria-modal="true"></div></div>
<div class="scrim" id="detailScrim" hidden><div class="modal detail" id="detailModal" role="dialog" aria-modal="true"></div></div>
<div class="scrim" id="statsScrim" hidden><div class="modal statsm" id="statsModal" role="dialog" aria-modal="true" aria-label="Deck stats"><div class="modal-head"><h2>Deck stats</h2><button class="icon-btn" data-close title="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body" id="statsHost"></div></div></div>
<div class="scrim" id="handScrim" hidden><div class="modal handm" id="handModal" role="dialog" aria-modal="true" aria-label="Test hand"></div></div>
<div class="scrim" id="pdfScrim" hidden><div class="modal pdfm" id="pdfModal" role="dialog" aria-modal="true"></div></div>
<div class="scrim" id="confirmScrim" hidden><div class="modal confirm" id="confirmModal" role="alertdialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="updateBar" hidden>New version available · <b>Reload</b></button>

<!-- Decks embedded by older saved files (also used by the test harness). -->
<script id="embedded-decks" type="application/json">{"version":2,"savedAt":0,"decks":{}}</script>
<!-- Scripts run in this order and share one global scope (see CLAUDE.md). -->
<script src="js/core/util.js?v=20261119223119"></script>
<script src="js/core/prefs.js?v=20261119223119"></script>
<script src="js/core/images.js?v=20261119223119"></script>
<script src="js/data/scryfall.js?v=20261119223119"></script>
<script src="js/data/prices.js?v=20261119223119"></script>
<script src="js/data/edhrec.js?v=20261119223119"></script>
<script src="js/data/decks.js?v=20261119223119"></script>
<script src="js/board/flip.js?v=20261119223119"></script>
<script src="js/board/scroll-bars.js?v=20261119223119"></script>
<script src="js/app/render.js?v=20261119223119"></script>
<script src="js/app/deck-list.js?v=20261119223119"></script>
<script src="js/stats/stats.js?v=20261119223119"></script>
<script src="js/stats/roles.js?v=20261119223119"></script>
<script src="js/stats/odds.js?v=20261119223119"></script>
<script src="js/stats/creature-types.js?v=20261119223119"></script>
<script src="js/board/suggestions.js?v=20261119223119"></script>
<script src="js/board/tiles.js?v=20261119223119"></script>
<script src="js/board/tokens.js?v=20261119223119"></script>
<script src="js/board/jump.js?v=20261119223119"></script>
<script src="js/board/card-actions.js?v=20261119223119"></script>
<script src="js/board/hover.js?v=20261119223119"></script>
<script src="js/board/drag.js?v=20261119223119"></script>
<script src="js/layout/panels.js?v=20261119223119"></script>
<script src="js/board/clicks.js?v=20261119223119"></script>
<script src="js/layout/toolbar.js?v=20261119223119"></script>
<script src="js/modals/add-cards.js?v=20261119223119"></script>
<script src="js/card-view/state.js?v=20261119223119"></script>
<script src="js/card-view/flights.js?v=20261119223119"></script>
<script src="js/card-view/coverflow.js?v=20261119223119"></script>
<script src="js/card-view/editor.js?v=20261119223119"></script>
<script src="js/card-view/save.js?v=20261119223119"></script>
<script src="js/modals/confirm.js?v=20261119223119"></script>
<script src="js/modals/pdf.js?v=20261119223119"></script>
<script src="js/data/files.js?v=20261119223119"></script>
<script src="js/data/drive.js?v=20261119223119"></script>
<script src="js/stats/test-hand.js?v=20261119223119"></script>
<script src="js/layout/fullscreen.js?v=20261119223119"></script>
<script src="js/layout/windows.js?v=20261119223119"></script>
<script src="js/app/main.js?v=20261119223119"></script>
</body>
</html>
