}
function moveToken(u){
  const d = cur(); if (guard(d)) return;
  const k = (d.tokens || []).find(x => x.uid === u); if (!k) return;
  animateBoard(() => { k.zone = tokZone(k) === "deck" ? "options" : "deck"; touch(d); renderBoard(); renderStats(); });
  toast(`${k.card.name} moved to the ${k.zone === "deck" ? "deck" : "card pool"}`);
}
function removeToken(u){
  const d = cur(); if (guard(d)) return;
  const k = (d.tokens || []).find(x => x.uid === u); if (!k) return;
  confirmTwice([{title: `Remove ${esc(k.card.name)}?`, text: "The token leaves this deck’s token list.", yes: "Remove token"}], () => {
    d.tokens = d.tokens.filter(x => x !== k); touch(d); renderBoard(); renderStats(); toast(`${k.card.name} removed`);
  });
}
/* Tokens your deck's cards make, from Scryfall's related cards. */
const tokenCache = {};
async function deckTokens(d){
  const ids = [...new Set([...cmdrs(d), ...d.cards.filter(c => c.zone === "deck").map(c => c.card)].map(c => c.id).filter(Boolean))];
  const key = ids.sort().join(",");
  if (tokenCache[key]) return tokenCache[key];
  const tokIds = new Set(), makers = {};
  for (let i = 0; i < ids.length; i += 75){
    const j = await sf("/cards/collection", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({identifiers: ids.slice(i, i + 75).map(id => ({id}))})});
    for (const c of (j && j.data) || []) for (const part of c.all_parts || []) if (part.component === "token"){ tokIds.add(part.id); (makers[part.id] = makers[part.id] || []).push(c.name); }
  }
  const out = [], list = [...tokIds];
  for (let i = 0; i < list.length; i += 75){
    const j = await sf("/cards/collection", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({identifiers: list.slice(i, i + 75).map(id => ({id}))})});
    for (const c of (j && j.data) || []) out.push({card: toCard(c), pairs: [...new Set(makers[c.id] || [])]});
  }
  const seen = new Set();
  const merged = [];
  for (const r of out){ const g = merged.find(m => sameToken(m.card, r.card)); if (g){ g.pairs = [...new Set([...g.pairs, ...r.pairs])]; g.arts = (g.arts || 1) + 1; } else merged.push({...r, arts: 1}); }
  tokenCache[key] = merged.sort((a, b) => a.card.name.localeCompare(b.card.name));
  return tokenCache[key];
}
function renderBoard(){
  const d = cur(); if (!d || !d.commander) return;
  $("#optBoxes").innerHTML = (d.typeOrder.map(t => boxHTML(d, "options", t)).join("") || `<div class="empty-note">No cards match the filter.</div>`) + tokenBoxHTML(d, "options");
  $("#deckBoxes").innerHTML = (d.typeOrder.map(t => boxHTML(d, "deck", t)).join("") || `<div class="empty-note">No cards match the filter.</div>`) + tokenBoxHTML(d, "deck");
  const pool = d.cards.filter(c => c.zone === "options"), deck = d.cards.filter(c => c.zone === "deck");
  const pv = sumPrice(cardsQ(pool)), dv = sumPrice(cardsQ(deck));
  const pc = list => sumQ(list.filter(c => isPricey(c.card))), po = pc(pool), pd = pc(deck);
  const sym = UI.cur === "usd" ? "$" : "€";
  $("#optMeta").innerHTML = `${sumQ(pool)} cards · ${fmtMoney(pv.tot, pv.sym)}${po ? ` · <span class="ph-pricey" title="${po} cards at ${sym}${priceyTh(d)} or more">💎 ${po}</span>` : ""}`;
  $("#deckMeta").innerHTML = `${sumQ(deck)} cards · ${fmtMoney(dv.tot, dv.sym)}${pd ? ` · <span class="ph-pricey" title="${pd} cards at ${sym}${priceyTh(d)} or more">💎 ${pd}</span>` : ""}`;
  renderJump();
  renderTools(d);
}
/* Quick jump: type icons in each panel heading scroll that side to the type's section. */
function renderJump(){
  for (const [zone, nav] of [["options", "#optJump"], ["deck", "#deckJump"]]){
    const boxes = [...document.querySelectorAll(`.panel[data-zone="${zone}"] .box`)];
    $(nav).innerHTML = boxes.map(b => {
      const t = b.dataset.type, n = b.querySelectorAll(".cw").length;
      return n ? `<button data-jump="${t}" class="${b.classList.contains("collapsed") ? "folded" : ""}" title="${PLURAL[t]} · ${n}${b.classList.contains("collapsed") ? " (hidden)" : ""}"><i class="ms ${MS[t]}"></i></button>` : "";
    }).join("");
  }
  markJump();
}
function markJump(){
  document.querySelectorAll(".panel").forEach(panel => {
    const sc = panel.querySelector(".panel-scroll"), head = panel.querySelector(".panel-head");
    const line = head.getBoundingClientRect().bottom + 50;
    let curT = null;
    panel.querySelectorAll(".box").forEach(b => { if (b.getBoundingClientRect().top <= line) curT = b.dataset.type; });
    if (sc.scrollTop < 4) curT = panel.querySelector(".box")?.dataset.type || null;
    panel.querySelectorAll(".jump button").forEach(btn => { btn.classList.toggle("on", btn.dataset.jump === curT); const bx = panel.querySelector(`.box[data-type="${btn.dataset.jump}"]`); btn.classList.toggle("folded", !!(bx && bx.classList.contains("collapsed"))); });
  });
}
document.querySelectorAll(".panel").forEach(panel => {
  const sc = panel.querySelector(".panel-scroll");
  let raf = 0;
  sc.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; markJump(); }); }, {passive: true});
  panel.querySelector(".jump").addEventListener("click", e => {
    const b = e.target.closest("[data-jump]"); if (!b) return;
    const box = panel.querySelector(`.box[data-type="${b.dataset.jump}"]`); if (!box) return;
    if (box.classList.contains("collapsed")) setFolded(`${panel.dataset.zone}:${b.dataset.jump}`, false);
    const head = panel.querySelector(".panel-head").offsetHeight;
    const y = box.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - head - 8;
    sc.scrollTo({top: Math.max(0, y), behavior: REDUCED.matches ? "auto" : "smooth"});
  });
});
function renderTools(d){
  const counts = new Map();
  for (const c of d.cards) if (/Creature/.test(c.card.type.split("//")[0])) for (const s of subtypes(c.card)) counts.set(s, (counts.get(s) || 0) + 1);
  const opts = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const html = `<option value="">All creature types</option>` + opts.map(([s, n]) => `<option value="${esc(s)}" ${UI.ctype === s ? "selected" : ""}>${esc(s)} (${n})</option>`).join("");
  if ($("#ctypeSel").dataset.h !== html){ $("#ctypeSel").innerHTML = html; $("#ctypeSel").dataset.h = html; }
  $("#ctypeSel").value = UI.ctype;
  $("#sortSel").value = UI.sort;
  $("#filterBox").classList.toggle("on", !!(UI.filter.trim() || UI.ctype));
}

/* ---------------- Card actions ---------------- */
function findCard(u){ const d = cur(); return d && d.cards.find(c => c.uid === u); }
function toggleLock(u){ const c = findCard(u); if (!c || guard()) return; animateBoard(() => { c.locked = !c.locked; touch(cur()); renderBoard(); renderHeader(); }); }
function toggleFocus(u){ const c = findCard(u); if (!c || guard()) return; c.focus = !c.focus; touch(cur()); renderBoard(); renderHeader(); toast(c.focus ? `Suggestions now also use ${c.card.name}` : `${c.card.name} no longer used for suggestions`); }
function moveOther(u){ const c = findCard(u); if (c) moveZone(u, c.zone === "deck" ? "options" : "deck"); }
function moveZone(u, zone){
  const d = cur(), c = findCard(u); if (!c || c.zone === zone || guard(d)) return;
  if (c.locked && zone !== "deck"){ toast("Unlock this card to move it out of the deck"); return; }
  animateBoard(() => { c.zone = zone; d.cards.splice(d.cards.indexOf(c), 1); d.cards.push(c); touch(d); renderAll(); });
  limitWarn(c);
}
function moveAll(zone){
  const d = cur(); if (!d || guard(d)) return;
  const list = d.cards.filter(c => c.zone !== zone && !c.locked && (!(UI.filter.trim() || UI.ctype) || matchesFilter(c)));
  if (!list.length){ toast(zone === "deck" ? "The card pool is empty" : "No unlocked cards in the deck"); return; }
  animateBoard(() => { list.forEach(c => c.zone = zone); touch(d); renderAll(); });
  toast(`Moved ${list.length} card${list.length > 1 ? "s" : ""} to the ${zone === "deck" ? "deck" : "card pool"}${UI.filter.trim() || UI.ctype ? " (only cards matching the filter)" : ""}`);
}
function limitWarn(c){
  const d = cur(); if (c.zone !== "deck") return;
  const n = sumQ(d.cards.filter(k => k.zone === "deck" && k.bucket === c.bucket));
  if (n > (d.limits[c.bucket] ?? 0)) toast(`Over your ${PLURAL[c.bucket].toLowerCase()} limit: ${n} of ${d.limits[c.bucket]}`);
}
function removeCard(u, ask = true){
  const d = cur(), c = findCard(u); if (!c || guard(d)) return;
  if (c.locked){ toast("Unlock this card before removing it"); return; }
  const go = () => { animateBoard(() => { d.cards.splice(d.cards.indexOf(c), 1); touch(d); renderAll(); }); toast(`${c.card.name} removed`); };
  if (!ask) return go();
  confirmTwice([{title: `Remove ${esc(c.card.name)}?`, text: `It leaves the ${c.zone === "deck" ? "deck" : "card pool"}. You can add it again later from Add cards.`, yes: "Remove card"}], go);
}

/* ---------------- Hover preview (mouse only; not on the board, where the size slider does the job) ---------------- */
const prev = $("#hoverPrev");
let prevSrc = null;
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || drag){ if (!prev.hidden) prev.hidden = true; return; }
  const el = e.target.closest("[data-img]");
  if (!el || !el.dataset.img || el.closest("#detailScrim") || el.closest("#board")){ if (!prev.hidden) prev.hidden = true; return; }
  if (prevSrc !== el.dataset.img){ prevSrc = el.dataset.img; prev.src = prevSrc; }
  prev.hidden = false;
  const W = 300, H = W * 88 / 63, pad = 18;
  let x = e.clientX + pad; if (x + W > innerWidth - 8) x = e.clientX - pad - W;
  let y = e.clientY - H / 2; y = Math.max(8, Math.min(innerHeight - H - 8, y));
  prev.style.transform = `translate(${x}px, ${y}px)`;
});
document.addEventListener("pointerdown", () => { prev.hidden = true; });
document.addEventListener("scroll", () => { prev.hidden = true; }, true);

/* ---------------- Drag & drop ----------------
   Mouse: press and move. Touch: press and hold a card ~0.2 s until it lifts, then drag.
   Box handles (⋮⋮) drag right away on both. Reordering stays inside the locked or the unlocked group. */
let press = null, drag = null, suppressClick = false;
document.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch" || e.button > 0) return;
  const grip = e.target.closest(".box-grip");
  const tile = !grip && e.target.closest("#board .ct");
  if (!grip && !tile) return;
  if (tile && tile.closest("[data-tok]")) return;
  press = {x: e.clientX, y: e.clientY, kind: grip ? "box" : "card", el: grip ? grip.closest(".box") : tile.closest(".cw")};
  if (grip) e.preventDefault();
});
window.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") return;
  if (drag){ e.preventDefault(); drag.x = e.clientX; drag.y = e.clientY; moveDrag(); return; }
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 5) startDrag(press.kind, press.el, e.clientX, e.clientY);
});
window.addEventListener("pointerup", e => { if (e.pointerType === "touch") return; press = null; if (drag) endDrag(true); });

let tp = null;
document.addEventListener("touchstart", e => {
  if (e.touches.length > 1){ cancelTouch(); return; }
  const t = e.touches[0];
  const grip = e.target.closest(".box-grip");
  if (grip){ e.preventDefault(); startDrag("box", grip.closest(".box"), t.clientX, t.clientY); return; }
  const tile = e.target.closest("#board .ct"); if (!tile || tile.closest("[data-tok]")) return;
  const cw = tile.closest(".cw");
  tp = {x: t.clientX, y: t.clientY, el: cw, timer: setTimeout(() => {
    if (!tp) return; navigator.vibrate?.(15); cw.classList.add("lifted");
    startDrag("card", cw, tp.x, tp.y); tp = null;
  }, 200)};
}, {passive: false});
document.addEventListener("touchmove", e => {
  if (drag){ e.preventDefault(); const t = e.touches[0]; drag.x = t.clientX; drag.y = t.clientY; moveDrag(); return; }
  if (tp){ const t = e.touches[0]; if (Math.hypot(t.clientX - tp.x, t.clientY - tp.y) > 10) cancelTouch(); }

/* ---------------- Flights between the board and the cover flow ----------------
   One smooth curve (cubic Bézier with a gentle S), sampled finely so speed and direction never change abruptly.
   The duration follows the distance: close cards arrive quickly, far ones take a little longer. */
function bezierEase(x1, y1, x2, y2){
  const bx = s => 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;
  const by = s => 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
  return u => { let lo = 0, hi = 1; for (let i = 0; i < 30; i++){ const m = (lo + hi) / 2; if (bx(m) < u) lo = m; else hi = m; } return by((lo + hi) / 2); };
}
const FLY_EASE = bezierEase(.32, 0, .18, 1);
const flightMs = dist => Math.round(Math.max(220, Math.min(520, 200 + dist * .32)));
function sFlight(fly, r0, r1, dur){
  Object.assign(fly.style, {left: r1.left + "px", top: r1.top + "px", width: r1.width + "px", height: r1.height + "px", transformOrigin: "50% 50%"});
  const dx = (r0.left + r0.width / 2) - (r1.left + r1.width / 2), dy = (r0.top + r0.height / 2) - (r1.top + r1.height / 2);
  const dist = Math.hypot(dx, dy) || 1, bend = Math.min(80, dist * .14);
  const nx = -dy / dist * bend, ny = dx / dist * bend;            // sideways, for the S
  // a single gentle arc: both control points bow to the same side, so direction changes smoothly the whole way
  const P0 = [dx, dy], P1 = [dx * .66 + nx * .8, dy * .66 + ny * .8], P2 = [dx * .2 + nx * .5, dy * .2 + ny * .5], P3 = [0, 0];
  const bez = (k, u) => { const m = 1 - u; return m * m * m * P0[k] + 3 * m * m * u * P1[k] + 3 * m * u * u * P2[k] + u * u * u * P3[k]; };
  const s0 = r0.width / r1.width, N = 40, frames = [];
  for (let i = 0; i <= N; i++){
    const u = i / N, e = FLY_EASE(u);
    frames.push({transform: `translate(${bez(0, e).toFixed(2)}px,${bez(1, e).toFixed(2)}px) scale(${(s0 + (1 - s0) * e).toFixed(4)})`, offset: u});

function pdfFaces(d){

async function buildPdf(onProgress){
  const d = cur();
  if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const faces = pdfFaces(d);
  const doc = new window.jspdf.jsPDF({unit: "mm", format: "a4", orientation: "portrait", compress: true});
  const PW = 210, PH = 297, W = 63, H = 88, mx = (PW - 3 * W) / 2, my = (PH - 3 * H) / 2;
  const cache = new Map(), failed = [];
  for (let i = 0; i < faces.length; i++){
    const f = faces[i], k = i % 9;
    if (k === 0){
      if (i) doc.addPage("a4", "portrait");
      doc.setDrawColor(150); doc.setLineWidth(0.2);
      for (let c = 0; c <= 3; c++){ const x = mx + c * W; doc.line(x, 2, x, my - 1.5); doc.line(x, PH - my + 1.5, x, PH - 2); }
      for (let r = 0; r <= 3; r++){ const y = my + r * H; doc.line(2, y, mx - 1.5, y); doc.line(PW - mx + 1.5, y, PW - 2, y); }
      const rx = mx, ry = PH - 7;

    }
    const x = mx + (k % 3) * W, y = my + Math.floor(k / 3) * H;
    onProgress && onProgress(i, faces.length, f.name);
    try {
      let data = cache.get(f.url);
      if (!data){ data = await toDataURL(f.url); cache.set(f.url, data); }
      doc.addImage(data, "JPEG", x, y, W, H, f.url, "FAST");
    } catch {

}

/* Upload without losing anyone's work when several people save at once:

async function drivePushNow(){
  for (let attempt = 0; attempt < 4; attempt++){
    const m0 = await (await dfetch(`/drive/v3/files/${DS.file.id}?fields=headRevisionId,modifiedTime&supportsAllDrives=true`)).json();
    if ((m0.headRevisionId || m0.modifiedTime) !== DS.rev){ DS.rev = null; await drivePull(); }
    const basedOn = DS.rev;

    const r = await dfetch(`/upload/drive/v3/files/${DS.file.id}?uploadType=media&fields=${DMETA}&supportsAllDrives=true`, {method: "PATCH", headers: {"Content-Type": "application/json"}, body});
    try { DS.remote = JSON.parse(body).decks; } catch {}
    const m = await r.json(); useMeta(m);
    DS.rev = m.headRevisionId || m.modifiedTime;
    DS.known = new Set(); for (const d of Object.values(S.decks)){ DS.known.add(d.ver); (d.past || []).forEach(v => DS.known.add(v)); }
    // did anyone else save between our check and our upload?

      const revs = ((await (await dfetch(`/drive/v3/files/${DS.file.id}/revisions?fields=revisions(id)&pageSize=1000`)).json()).revisions || []).map(x => x.id);

        const data = await (await dfetch(`/drive/v3/files/${DS.file.id}/revisions/${rid}?alt=media`)).json();
        await storeImages(data.images);
        const rep = mergeDecks(data.decks || {});
        if (rep.added.length || rep.updated.length || rep.conflicts.length || rep.restored.length) changed = true;
        for (const [id, mm] of Object.entries(data.members || {})) if (!DS.members[id]) DS.members[id] = mm;
      } catch (e){ if (e.message === "reconnect") throw e; }
    }

    save(false); render();
  }
}

    if (!DS.permsAt || Date.now() - DS.permsAt > 120000){ DS.permsAt = Date.now(); loadPerms(); }
    if (!DS.permsAt || Date.now() - DS.permsAt > 120000){ DS.permsAt = Date.now(); loadPerms(); }
    if ((push || ahead) && DS.canEdit) await drivePushNow();
    DS.last = Date.now(); setDrive("ok");
  } catch (e){ if (e.message !== "reconnect") setDrive("error", e.message); }

}
function driveSchedule(){

/* Checking for other people's changes: a tiny "has the file changed?" request (about 1 KB); the decks are only downloaded

   every minute after 2 minutes without activity, paused while the tab is hidden. */
function pollDelay(){
  if (Date.now() - lastInput > 120000) return 60000;
  const c = navigator.connection;
  const mobile = c && (c.saveData || c.type === "cellular" || /^(slow-2g|2g|3g)$/.test(c.effectiveType || ""));
  return mobile ? 10000 : 5000;
}
let lastInput = Date.now();
["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, {passive: true, capture: true}));
async function pollLoop(){
  try { if (DS.token && DS.file && document.visibilityState === "visible" && !DS.busy && DS.status !== "pending") await driveSync(false); } catch {}
  setTimeout(pollLoop, pollDelay());
}

    DS.user = j.user || null;
    if (DS.user && DS.user.permissionId){
      DS.me = {id: DS.user.permissionId, name: DS.user.displayName, photo: DS.user.photoLink || ""};
      LAST_ME = DS.me; try { if (CLOUD()) localStorage.removeItem("command-zone-me"); else localStorage.setItem("command-zone-me", JSON.stringify(DS.me)); } catch {}
    }
    render();
    setDrive("ok");
    if (DS.file){ DS.rev = null; await driveSync(false); toast(`Synced with ${DS.file.name}`); }
  } catch (e){ if (e.message !== "reconnect") toast(e.message); renderDrive(); }
}
async function driveCreate(){
  if (!DS.token) return;

    DS.loaded = true; if (!cur()) S.active = liveDecks()[0]?.id || null;
    save(false);
    const bd = "cz" + uid(), meta = {name: LIB_NAME, mimeType: "application/json", description: "Decks for MTG Deck Builder. Share this file to give friends access: Editor can edit decks, Viewer can only look."};
    const body = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${libraryPayload()}\r\n--${bd}--`;
    const m = await (await dfetch(`/upload/drive/v3/files?uploadType=multipart&fields=${DMETA}`, {method: "POST", headers: {"Content-Type": `multipart/related; boundary=${bd}`}, body})).json();
    useMeta(m); DS.rev = m.headRevisionId || m.modifiedTime; DS.known = null; DS.remote = {...S.decks}; render(); loadPerms();
    DS.last = Date.now(); setDrive("ok");
    showReport("Your shared deck library is ready", [
      `It's a file called “${m.name}” in your Google Drive, and all your decks are in it.`,
      "To invite friends: open it in Drive (the link under Google Drive in the sidebar), press Share and add their email. Editor = can create and edit decks. Viewer = can only look.",
      "Friends then open this website, press “Connect Google Drive” and “Open shared library”, and pick the file."]);
  } catch (e){ if (e.message !== "reconnect") setDrive("error", e.message); }
}
async function driveOpen(){

function agoText(t){ const s = Math.round((Date.now() - t) / 1000); return s < 10 ? "just now" : s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; }

function renameInList(id){

/* Always run the newest version: GitHub Pages lets browsers cache the page for ~10 minutes,
   so ask for the current build number directly and switch when it's newer. */
async function latestBuild(){
  const r = await fetch(location.pathname + "?build-check=" + Date.now(), {cache: "no-store"});
  const m = (await r.text()).match(/const BUILD = "([^"]+)"/);
  return m ? m[1] : null;
}
const freshUrl = b => location.pathname + "?v=" + encodeURIComponent(b) + location.hash;
async function checkForUpdate(onStart){
  if (location.protocol !== "https:" || BUILD === "dev") return;
  try {
    const b = await latestBuild();
    if (!b || b === BUILD) return;
    if (onStart && !sessionStorage.getItem("mtg-updated-to-" + b)){ sessionStorage.setItem("mtg-updated-to-" + b, "1"); location.replace(freshUrl(b)); return; }
    $("#updateBar").hidden = false; $("#updateBar").onclick = () => location.replace(freshUrl(b));
  } catch {}
}
checkForUpdate(true);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(false); });
