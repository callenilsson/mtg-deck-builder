}
function reportText(rep){
  const parts = [];
  if (rep.added.length) parts.push(`${rep.added.length} new deck${rep.added.length > 1 ? "s" : ""}: ${rep.added.join(", ")}`);
  if (rep.updated.length) parts.push(`${rep.updated.length} updated: ${rep.updated.join(", ")}`);
  if (rep.restored.length) parts.push(`${rep.restored.length} brought back because they were edited after you deleted them: ${rep.restored.join(", ")}`);
  if (rep.conflicts.length) parts.push(`${rep.conflicts.length} edited by both of you, so both versions were kept (same names get “1” for yours and “2” for theirs): ${rep.conflicts.join(", ")}`);
  if (rep.kept.length) parts.push(`${rep.kept.length} deleted in the file but you edited them since, so they were kept: ${rep.kept.join(", ")}`);
  return parts;
}
/* Website: decks come only from the Drive library, fresh at every sign-in, and are never kept in the browser.
   (The downloaded file keeps working offline with the browser's storage, as before.) */
const CLOUD = () => typeof GDRIVE !== "undefined" && driveUsable();
const SESSION_KEY = "mtg-session";
let LEGACY = null;        // decks this browser kept before: added to the library once, then removed here
const gated = () => CLOUD() && !DS.loaded;
function load(){
  if (CLOUD()){
    try { const loc = JSON.parse(localStorage.getItem(KEY) || "null"); if (loc && loc.decks && Object.values(loc.decks).some(d => !d.deleted)) LEGACY = {decks: loc.decks}; } catch {}
    try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); if (s){ S.active = s.active || null; if (typeof s.sidebarOpen === "boolean" && innerWidth >= 1280) S.sidebarOpen = s.sidebarOpen; } } catch {}
    if (innerWidth < 1280) S.sidebarOpen = false;   // phones, unfolded foldables, tablets: the deck list starts folded so the cards get the room
    S.decks = {};

  }
  let emb = {};

  let loc = null;
  try { loc = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
  if (loc){
    S.decks = loc.decks || {}; S.active = loc.active; S.lastFileSave = loc.lastFileSave || 0; S.lastChange = loc.lastChange || 0;
    if (typeof loc.sidebarOpen === "boolean" && innerWidth >= 1280) S.sidebarOpen = loc.sidebarOpen;
  }
  Object.values(S.decks).forEach(ensureVer);
  storeImages(emb.images).then(n => { if (n) render(); });
  const rep = mergeDecks(emb.decks);
  const parts = reportText(rep);

}
function save(changed = true){

/* ---------------- Board animation: cards glide to their new place (FLIP) ---------------- */
function snapshot(){
  const m = new Map(), vh = innerHeight;
  document.querySelectorAll("#board .cw[data-uid]").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.bottom > -40 && r.top < vh + 40) m.set(el.dataset.uid, {r, zone: el.closest(".panel").dataset.zone, src: el.querySelector(".ct img")?.src});
  });
  return m;
}
function animateBoard(fn, opts = {}){
  if (REDUCED.matches || $("#board").hidden){ fn(); return; }
  const before = snapshot();
  fn();
  const vh = innerHeight; let n = 0;
  document.querySelectorAll("#board .cw[data-uid]").forEach(el => {
    if (n > 140) return;
    const r = el.getBoundingClientRect();
    if (r.bottom < -40 || r.top > vh + 40) return;
    const u = el.dataset.uid, b = before.get(u);
    if (b){
      const dx = b.r.left - r.left, dy = b.r.top - r.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      n++;
      if (b.zone !== el.closest(".panel").dataset.zone && b.src){
        // across the divider: fly a copy above both panels so it isn't clipped
        const ct = el.querySelector(".ct"), cr = ct.getBoundingClientRect();
        const fly = document.createElement("img"); fly.src = b.src; fly.className = "fly";
        Object.assign(fly.style, {left: cr.left + "px", top: cr.top + "px", width: cr.width + "px", height: cr.height + "px"});
        document.body.appendChild(fly); el.style.visibility = "hidden";
        const sx = b.r.width / r.width;
        const a = fly.animate([{transform: `translate(${b.r.left - cr.left}px,${b.r.top - cr.top}px) scale(${sx})`}, {transform: "none"}], {duration: 360, easing: EASE});
        a.onfinish = a.oncancel = () => { fly.remove(); el.style.visibility = ""; };
      } else el.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: "none"}], {duration: 300, easing: EASE});
    } else if (opts.added && opts.added.includes(u)){
      n++; el.animate([{opacity: 0, transform: "scale(.9) translateY(8px)"}, {opacity: 1, transform: "none"}], {duration: 260, easing: EASE});
    }
  });
}

/* ---------------- EDHREC type suggestions ----------------
   1. Find the EDHREC theme for this commander whose card lists best match your cards.
   2. Use that theme's average type counts (or the commander's overall average), with basics vs other lands.
   3. Adjust lands for your mana curve versus the typical deck's curve.
   4. Keep the total at 100 with your commander(s). */
const SUGG = {};
function suggestKey(d){
  const names = d.cards.filter(c => c.zone === "deck").map(c => c.card.name).sort();
  return cmdKey(d) + "|" + names.length + "|" + names.join(",").length + "|" + names.slice(0, 40).join(",");
}
function curveAvg(curve){
  let n = 0, sum = 0;

}
async function loadSuggestion(d, key){
  SUGG[key] = {loading: true};
  try {
    const {j: base, path} = await cmdPage(d);
    if (!base) throw new Error(`EDHREC has no data for ${cmdKey(d)} yet.`);
    const totalDecks = base.container?.json_dict?.card?.num_decks || base.num_decks_avg || 0;
    const tags = ((base.panels && base.panels.taglinks) || []).slice(0, 10);
    const ours = new Set(d.cards.map(c => c.card.name));
    let best = null;
    if (ours.size >= 6 && tags.length){
      const pages = await Promise.all(tags.map(t => edh(`${path}/${t.slug}`)));
      pages.forEach((pg, i) => {
        if (!pg) return;
        const seen = new Set(); let score = 0, hits = 0;
        for (const l of edhLists(pg)) for (const cv of l.cardviews || []){
          if (seen.has(cv.name) || !ours.has(cv.name)) continue;
          seen.add(cv.name); hits++; score += Math.max(0, cv.synergy || 0) + 0.03;
        }
        if (hits >= 3 && score >= 0.3 && (!best || score > best.score)) best = {tag: tags[i], page: pg, score, hits};
      });
    }
    const src = best ? best.page : base;
    const counts = {};
    for (const t of TYPES) counts[t] = Math.max(0, Math.round(src[t.toLowerCase()] ?? 0));
    let landNote = "";
    const spells = d.cards.filter(c => c.zone === "deck" && c.bucket !== "Land");
    const avgE = curveAvg(src.panels && src.panels.mana_curve) ?? curveAvg(base.panels && base.panels.mana_curve);
    if (avgE != null && spells.length >= 10){
      const avgO = spells.reduce((a, c) => a + (c.card.cmc || 0), 0) / spells.length;
      const adj = Math.max(-3, Math.min(3, Math.round((avgO - avgE) * 3)));
      if (adj){
        counts.Land += adj;
        landNote = ` ${adj > 0 ? "+" : ""}${adj} land${Math.abs(adj) > 1 ? "s" : ""} because your spells cost ${avgO.toFixed(1)} on average versus ${avgE.toFixed(1)} in those decks.`;
      }
    }
    let diff = (100 - cmdrs(d).length) - Object.values(counts).reduce((a, b) => a + b, 0);
    const nonland = TYPES.filter(t => t !== "Land");
    let guard = 200;
    while (diff !== 0 && guard--){
      const pool = nonland.filter(t => diff > 0 || counts[t] > 0).sort((a, b) => counts[b] - counts[a]);
      const t = pool[0] || "Land";
      counts[t] += Math.sign(diff); diff -= Math.sign(diff);

    // basics vs other lands, scaled to the suggested land count
    const sb = src.basic ?? base.basic, sn = src.nonbasic ?? base.nonbasic;
    let basic = null, nonbasic = null;
    if (sb != null && sn != null && sb + sn > 0){ basic = Math.round(counts.Land * sb / (sb + sn)); nonbasic = counts.Land - basic; }
    const n = best ? best.tag.count : totalDecks;
    const who = d.partner ? cmdKey(d) : d.commander.name.split(",")[0];
    const short = best ? `From ${(+n || 0).toLocaleString()} “${best.tag.value}” decks` : `From ${(+n || 0).toLocaleString()} ${who} decks`;
    const why = best
      ? `Your deck matches EDHREC’s “${best.tag.value}” ${cmdKey(d)} decks best (${best.hits} of your cards are typical there). These are their average type counts.${landNote}`
      : `Average type counts across ${(+n || 0).toLocaleString()} ${cmdKey(d)} decks on EDHREC.${ours.size < 6 ? " Add a few more cards and the suggestion will match your deck’s theme." : ""}${landNote}`;
    SUGG[key] = {counts, basic, nonbasic, short: short + (landNote ? " · lands adjusted" : ""), why};
  } catch (err){
    SUGG[key] = {loading: true, error: err.message || "Couldn’t reach EDHREC."};
    setTimeout(() => { if (SUGG[key] && SUGG[key].error) delete SUGG[key]; }, 15000);
  }

}
/* Split basics by how many colored mana symbols your deck's spells use. */
function basicSplit(d, n){
  const ci = deckCI(d); if (!ci.length) return [{name: "Wastes", count: n}];
  const w = Object.fromEntries(ci.map(x => [x, 0]));
  for (const c of d.cards) if (c.zone === "deck" && c.bucket !== "Land") for (const m of String(c.card.mana).matchAll(/\{([^}]+)\}/g)) for (const x of ci) if (m[1].includes(x)) w[x]++;
  let tot = Object.values(w).reduce((a, b) => a + b, 0);
  if (!tot){ ci.forEach(x => w[x] = 1); tot = ci.length; }
  const raw = ci.map(x => ({x, f: n * w[x] / tot}));
  const out = raw.map(r => ({x: r.x, count: Math.floor(r.f), rem: r.f % 1}));
  let left = n - out.reduce((a, b) => a + b.count, 0);
  out.sort((a, b) => b.rem - a.rem).forEach(o => { if (left > 0){ o.count++; left--; } });
  return out.filter(o => o.count > 0).map(o => ({name: BASIC_OF[o.x], count: o.count}));
}

/* When the divider moves and a row gains or loses a column, the visible cards glide to their new spots instead of jumping. */
function splitFlip(apply){
  if (REDUCED.matches){ apply(); return; }
  const vis = [];
  for (const el of document.querySelectorAll("#board .cw")){
    const r = el.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight && r.width) vis.push([el, r, el.offsetLeft, el.offsetTop]);
  }
  apply();
  for (const [el, r, ox, oy] of vis){
    // offsetLeft/Top ignore animations: a real jump means the card changed row or column inside its panel
    if (Math.abs(el.offsetLeft - ox) < 20 && Math.abs(el.offsetTop - oy) < 20) continue;
    if (el._sa){ el._sa.cancel(); el._sa = null; }
    const n = el.getBoundingClientRect(), dx = r.left - n.left, dy = r.top - n.top;
    el._sa = el.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: "none"}], {duration: 340, easing: "cubic-bezier(.22,1,.36,1)"});
    el._sa.onfinish = () => { el._sa = null; };
  }
}

async function buildPdf(onProgress){
  const d = cur();

  const faces = pdfFaces(d);
  const doc = new window.jspdf.jsPDF({unit: "mm", format: "a4", orientation: "portrait", compress: true});

  const cache = new Map(), failed = [];

      for (let r = 0; r <= 3; r++){ const y = my + r * H; doc.line(2, y, mx - 1.5, y); doc.line(PW - mx + 1.5, y, PW - 2, y); }

      for (let b = 0; b < 5; b++){ doc.setFillColor(b % 2 ? 255 : 0); doc.rect(rx + b * 10, ry, 10, bh, "FD"); }
      doc.setFontSize(6.5); doc.setTextColor(0); doc.setFont("helvetica", "normal");
      for (let b = 0; b <= 5; b++) doc.text(b === 5 ? "5 cm" : String(b), rx + b * 10, ry + bh + 3, {align: b === 0 ? "left" : b === 5 ? "right" : "center"});
      doc.setFillColor(255); doc.rect(rx + 64, ry - 2, PW - mx - (rx + 64) + 1, 8.6, "F");   // keeps the cut lines out of the text
      doc.setFont("helvetica", "bold"); doc.setFontSize(8.5);
      doc.text("CHECK THE SCALE: this bar must measure exactly 5 cm.", rx + 66, ry + 1.6);
      doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(60);
      doc.text("If it doesn't, print again at 100% / \"Actual size\" with \"Fit to page\" turned off. Cards are 6.3 x 8.8 cm.", rx + 66, ry + 5.2);
      doc.text(`${displayName(d)}  ·  page ${Math.floor(i / 9) + 1} of ${Math.ceil(faces.length / 9)}`, PW - mx, 6, {align: "right"});

}

/* ---------------- Test hand: deal a hand, mulligan (London), then play simple turns: one land a turn, spells if you have the mana ---------------- */
const H = {lib: [], hand: [], bf: [], gy: [], turn: 0, mull: 0, bottom: 0, landPlayed: false, used: 0, drew: null, free: false, cmdTurn: null};
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const isLandC = c => /\bLand\b/.test(String(c.card.type).split("//")[0]);
const isPermC = c => !/\b(Instant|Sorcery)\b/.test(String(c.card.type).split("//")[0]);
function makesMana(c){ const d = cur(); return !isLandC(c) && isPermC(c) && (sourceColors(c.card, deckCI(d)).length > 0 || /\{t\}[^.\n]*:\s*add/i.test(c.card.text || "")); }
function manaNow(){ return H.bf.filter(x => isLandC(x.c) || (makesMana(x.c) && x.since < H.turn)).length; }
function newHand(keepMull){
  const d = cur(); if (!d) return;
  const lib = [];
  for (const c of d.cards.filter(c => c.zone === "deck")) for (let i = 0; i < qOf(c); i++) lib.push(c);
  Object.assign(H, {lib: shuffle(lib), bf: [], gy: [], turn: 1, landPlayed: false, used: 0, drew: null, cmdTurn: null});
  H.hand = H.lib.splice(0, 7);
  if (!keepMull) H.mull = 0;
  H.bottom = Math.max(0, H.mull - 1);       // the first mulligan is free in Commander
  renderHand();
}
/* Play many quick games automatically with the same simple rules: a land each turn, mana makers first, the commander as soon as possible. */
function simulate(games = 1000){
  const d = cur(), lib0 = [];
  for (const c of d.cards.filter(c => c.zone === "deck")) for (let i = 0; i < qOf(c); i++) lib0.push(c);
  const cm = d.commander, cmc = cm ? Math.max(1, Math.round(cm.cmc || 0)) : 0, T = 10;
  const isMk = new Map(lib0.map(c => [c, makesMana(c)]));
  let keep = 0, cmdBy = 0, cmdSum = 0, cmdN = 0, m4 = 0, m6 = 0, stuck = 0;
  for (let g = 0; g < games; g++){
    const lib = shuffle(lib0.slice());
    let hand = lib.splice(0, 7);
    const ln = hand.filter(isLandC).length;
    if (ln >= 2 && ln <= 4) keep++;
    else { const lib2 = shuffle(lib0.slice()); hand = lib2.splice(0, 7); lib.length = 0; lib.push(...lib2); }   // one free mulligan
    let lands = 0, rocks = 0, newRocks = 0, cast = 0;
    for (let tu = 1; tu <= T; tu++){
      if (tu > 1 && lib.length) hand.push(lib.shift());
      rocks += newRocks; newRocks = 0;
      const li = hand.findIndex(isLandC); if (li >= 0){ hand.splice(li, 1); lands++; }
      let mana = lands + rocks;
      if (tu === 4) m4 += mana; if (tu === 6) m6 += mana;
      if (tu === 3 && lands < 3) stuck++;
      if (cm && !cast && mana >= cmc){ cast = tu; mana -= cmc; }
      // mana makers, cheapest first
      hand.sort((a, b) => (a.card.cmc || 0) - (b.card.cmc || 0));
      for (let i = 0; i < hand.length; i++){ const c = hand[i], k = Math.round(c.card.cmc || 0); if (isMk.get(c) && k <= mana){ mana -= k; newRocks++; hand.splice(i--, 1); } }
      if (cm && !cast && mana >= cmc){ cast = tu; mana -= cmc; }
    }
    if (cast){ cmdSum += cast; cmdN++; if (cast <= cmc) cmdBy++; }
  }
  return {games, keep: keep / games, cmdBy: cmdBy / games, cmdAvg: cmdN ? cmdSum / cmdN : null, cmdNever: 1 - cmdN / games, m4: m4 / games, m6: m6 / games, stuck: stuck / games, cmc, cm};
}
function simHTML(r){

      <div><b>${r.m6.toFixed(1)}</b><span>mana on turn 6</span></div>
      <div><b class="${r.keep >= .75 ? "good" : "bad"}">${pc(r.keep)}</b><span>keepable 7 (2–4 lands)</span></div>

}

      <div class="bfz"><div class="zone-h">Battlefield</div>

/* the card flies from where it was to its new place on the battlefield */
function flyToBf(fromRect, src){
  const el = [...document.querySelectorAll("#hBf [data-bi]")].find(x => +x.dataset.bi === H.bf.length - 1);
  if (!el || !fromRect || REDUCED.matches) return;
  const to = el.getBoundingClientRect();
  el.animate([{transform: `translate(${fromRect.left - to.left}px,${fromRect.top - to.top}px) scale(${fromRect.width / to.width})`, transformOrigin: "0 0", zIndex: 5},

function playFromHand(i, fromRect){

    H.hand.splice(i, 1); H.bf.push({c, since: H.turn}); H.landPlayed = true; renderHand(); flyToBf(fromRect); return;
  }
  const cost = Math.round(c.card.cmc || 0), left = manaNow() - H.used;
  if (cost > left && !H.free){ toast(`${c.card.name} costs ${cost}: you have ${left} mana left this turn`); return; }

  if (isPermC(c)){ H.bf.push({c, since: H.turn}); renderHand(); flyToBf(fromRect); }
  else { H.gy.push(c); renderHand(); toast(`${c.card.name} cast (to the graveyard)`); }
}

/* ---------------- Full screen: hides the browser's address bar; press again (or swipe / Esc) to go back ---------------- */
const IOS = /iP(hone|od)/.test(navigator.userAgent);
const FS_ICO = `<svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`, FSX_ICO = `<svg class="i" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>`;
const fsSupported = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
async function toggleFull(){
  if (!fsSupported()){
    if (IOS) toast("On iPhone, websites can't go full screen. In Safari, tap aA in the address bar, then Hide Toolbar.");
    return;
  }
  try {
    if (isFull()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else await (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement, {navigationUI: "hide"});
  } catch { toast("This browser didn't allow full screen"); }
}
function syncFull(){
  const on = isFull(), b = $("#fsBtn");
  if (b){ b.hidden = !(fsSupported() || IOS); b.innerHTML = (on ? FSX_ICO : FS_ICO) + `<span class="tl">${on ? "Exit full screen" : "Full screen"}</span>`; b.title = on ? "Leave full screen (you can also press Esc or swipe from the top)" : "Full screen: hide the browser's address bar"; b.classList.toggle("on", on); }
  const d = cur(); if (d && d.commander) renderRail(d);
}
document.addEventListener("fullscreenchange", syncFull); document.addEventListener("webkitfullscreenchange", syncFull);
$("#fsBtn").addEventListener("click", toggleFull);

/* ---------------- Phones: the stats live in their own window, so the cards keep their room ---------------- */
let statsSpot = null;
function openStats(){
  const st = $("#stats"); if (!st) return;
  if (!statsSpot){ statsSpot = document.createComment("stats"); st.before(statsSpot); }
  $("#statsHost").appendChild(st); showScrim("#statsScrim");
}
function closeStats(){ const st = $("#stats"); if (statsSpot && st && st.parentElement !== statsSpot.parentElement) statsSpot.after(st); $("#statsScrim").hidden = true; hideInfo(); }
$("#statsBtn").onclick = openStats;
$("#statsModal").addEventListener("click", e => { if (e.target.closest("[data-close]")) closeStats(); else if (e.target.closest("[data-open]")) closeStats(); });


/* ---------------- Scrims ---------------- */
function showScrim(sel){ $(sel).hidden = false; }
let revealAfterAdd = null;
function revealCard(u){
  const el = document.querySelector(`#board .cw[data-uid="${u}"], #board .cw[data-tok="${u}"]`); if (!el) return;
  const box = el.closest(".box"); if (box && box.classList.contains("collapsed")) setFolded(`${box.dataset.zone}:${box.dataset.type}`, false);
  el.scrollIntoView({block: "center", behavior: REDUCED.matches ? "auto" : "smooth"});
  setTimeout(() => el.querySelector(".ct")?.animate([{boxShadow: "0 0 0 0 rgba(217,171,79,.9)"}, {boxShadow: "0 0 0 10px rgba(217,171,79,0)"}], {duration: 900, iterations: 2}), 350);
}
function hideScrim(sel){
  if (sel === "#detailScrim"){ requestClose(); return; }
  if (sel === "#statsScrim"){ closeStats(); return; }
  $(sel).hidden = true;
  if (sel === "#addScrim"){ A.token++; if (revealAfterAdd){ const u = revealAfterAdd; revealAfterAdd = null; setTimeout(() => revealCard(u), 60); } }
}
document.querySelectorAll(".scrim").forEach(s => s.addEventListener("click", e => { if (e.target === s && !(s.id === "pdfScrim" && pdfBusy)) hideScrim("#" + s.id); }));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.activeElement && document.activeElement.id === "artName"){ document.activeElement.blur(); return; }
  for (const id of ["#confirmScrim", "#detailScrim", "#statsScrim", "#handScrim", "#pdfScrim", "#addScrim"]) if (!$(id).hidden){ if (id !== "#pdfScrim" || !pdfBusy) hideScrim(id); return; }
});

/* ---------------- Wiring ---------------- */
$("#profile").addEventListener("click", e => {

$("#closeSide").innerHTML = I.panelL; $("#railExpand").innerHTML = I.panelR;

});
$("#closeSide").onclick = () => { S.sidebarOpen = false; save(false); render(); };
$("#openSide").onclick = () => { S.sidebarOpen = !S.sidebarOpen; S.sideTouched = true; if (S.sidebarOpen && isPhone()) CMP_OPEN = false; save(false); render(); };
$("#sideScrim").onclick = () => { S.sidebarOpen = false; render(); };
$("#deckList").addEventListener("click", e => {
  const dm = e.target.closest("[data-deckmenu]"); if (dm){ e.stopPropagation(); openDeckMenu(dm); return; }
  if (e.target.closest("[data-newdeck]")){ newDeck(); return; }
  const fh = e.target.closest("[data-folder]");
  if (fh){ UI.openPeople = UI.openPeople || {}; const k = fh.dataset.folder, mineF = !!fh.dataset.mine; UI.openPeople[k] = !folderOpen(k, mineF); saveUI(); renderSidebar(); return; }
  if (e.target.closest("#foldAll")){
    const me = meNow(), myId = me ? me.id : "me", ids = [...document.querySelectorAll("#deckList [data-folder]")].map(b => b.dataset.folder);
    const anyOpen = ids.some(id => folderOpen(id, id === myId));
    UI.openPeople = UI.openPeople || {}; ids.forEach(id => UI.openPeople[id] = !anyOpen); saveUI(); renderSidebar(); return;
  }
  if (e.target.closest(".deck-rename")) return;
  const it = e.target.closest("[data-deck]"); if (!it) return;
  S.active = it.dataset.deck; if (innerWidth <= 820) S.sidebarOpen = false; save(false); render();
});
function renameInList(id){
  if (guard(S.decks[id])) return;
  const d = S.decks[id]; const b = document.querySelector(`.deck-item[data-deck="${id}"] .deck-meta b`); if (!d || !b) return;
  const inp = document.createElement("input"); inp.className = "deck-rename"; inp.value = d.name || displayName(d); inp.setAttribute("aria-label", "Deck name");
  b.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = ok => { if (done) return; done = true; if (ok){ const v = inp.value.trim(); if (v && v !== d.name){ d.name = v; touch(d); } } renderSidebar(); renderHeader(); };
  inp.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  inp.addEventListener("blur", () => finish(true));
}
function duplicateDeck(id){
  const src = S.decks[id]; if (!src) return;
  const d = JSON.parse(JSON.stringify(src));
  d.id = uid(); d.ver = uid(); d.past = []; d.created = d.updated = Date.now();
  d.name = isMine(src) ? displayName(src) + " (copy)" : `${displayName(src)} (from ${ownerName(src).split(" ")[0]})`;
  d.owner = meNow() || undefined; delete d.by;
  d.cards.forEach(c => { c.locked = c.locked && isMine(src); });
  d.cards.forEach(c => c.uid = uid());
  S.decks[d.id] = d; S.active = d.id; save(); render();
  toast(`Copied to your decks: ${d.name}`);
}
$("#deckList").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset.deck) e.target.click(); });
let nameT;
$("#roBanner").addEventListener("click", e => { if (e.target.closest("#roCopy")) duplicateDeck(S.active); });
$("#deckName").addEventListener("input", e => {
  const d = cur(); if (!d || roDeck(d)) return; d.name = e.target.value; renderSidebar();
  clearTimeout(nameT); nameT = setTimeout(() => touch(d), 400);
});
$("#cmds").addEventListener("click", e => {
  const a = e.target.closest("[data-cact]");

    else if (a.dataset.cact === "change") kind === "partner" ? openPartnerPicker() : openCommanderPicker();
    else if (a.dataset.cact === "remove"){
      const d = cur();
      confirmTwice([{title: "Remove the partner?", text: `${esc(d.partner.name)} leaves the command zone. Recommendations go back to ${esc(d.commander.name)} alone.`, yes: "Remove partner"}], () => { d.partner = null; touch(d); render(); toast("Partner removed"); });
    }
    return;
  }
  const b = e.target.closest("[data-cmd]"); if (!b) return;
  const k = b.dataset.cmd;
  if (k === "addPartner") openPartnerPicker(); else openDetail({kind: k}, b);
});
$("#combo").addEventListener("click", e => {
  const x = e.target.closest("[data-unfocus]"); if (x){ e.stopPropagation(); toggleFocus(x.dataset.unfocus); return; }
  if (e.target.closest("#comboAdd")){
    toast("Press the two circles under any card to build around it");
    document.body.classList.remove("pulse-focus"); void document.body.offsetWidth; document.body.classList.add("pulse-focus");
    setTimeout(() => document.body.classList.remove("pulse-focus"), 2300); return;
  }
  const m = e.target.closest("[data-open]"); if (m && findCard(m.dataset.open)) openDetail({kind: "item", uid: m.dataset.open}, m);
});
$("#welcome").addEventListener("click", e => {
  if (e.target.closest("#gateSignIn")){ driveConnect(); return; }
  if (e.target.closest("#gateOpen")){ driveOpen(); return; }
  if (e.target.closest("#gateCreate")){ driveCreate(); return; }

$("#addAny").onclick = () => openAdd("Any", "options");
function setMini(on){ if (isCompact() || isPhone()) CMP_OPEN = !on; else { UI.cmdMini = on; saveUI(); }
  if (!on && isPhone() && S.sidebarOpen){ S.sidebarOpen = false; save(false); render(); } $("#top").classList.toggle("mini", on); applyZoom(); }
$("#foldTop").onclick = () => setMini(true);
$("#rail").addEventListener("click", e => {

    if (k === "add") $("#addAny").click(); else if (k === "hand") openHand(); else if (k === "stats") openStats(); else if (k === "print") openPdf(); else if (k === "fs") toggleFull();
    return; }
  if (e.target.closest("#railMenu")){ S.sidebarOpen = !S.sidebarOpen; S.sideTouched = true; if (S.sidebarOpen && isPhone()) CMP_OPEN = false; save(false); render(); return; }
  const th = e.target.closest("[data-cmd]"); if (th){ if (isPhone() || isCompact()) setMini(false); else openDetail({kind: "commander"}, th); }
});
addEventListener("resize", () => { const d = cur(); if (d && d.commander) renderRail(d); });

$("#pdfBtn").onclick = openPdf;
$("#saveFile").onclick = saveFile;
$("#importBtn").onclick = () => $("#importFile").click();

$("#total").addEventListener("change", e => {
  if (e.target.id === "curSel"){ UI.cur = e.target.value; saveUI(); renderAll(); return; }
  if (e.target.id !== "priceyIn") return;

  const v = parseFloat(String(e.target.value).replace(",", "."));
  if (!(v >= 0)){ renderHeader(); return; }
  d.pricey = v; touch(d); renderBoard(); renderHeader();
});
window.addEventListener("storage", e => { if (e.key === KEY && !CLOUD()){ try { S.decks = JSON.parse(e.newValue).decks; render(); } catch {} } });

/* Always run the newest version: GitHub Pages lets browsers cache the page for ~10 minutes,
   so ask for the current build number directly and switch when it's newer. */
async function latestBuild(){
  const r = await fetch(location.pathname + "?build-check=" + Date.now(), {cache: "no-store"});
  const m = (await r.text()).match(/const BUILD = "([^"]+)"/);
  return m ? m[1] : null;
}
const freshUrl = b => location.pathname + "?v=" + encodeURIComponent(b) + location.hash;
async function checkForUpdate(onStart){
  if (location.protocol !== "https:" || BUILD === "dev") return;
  try {
    const b = await latestBuild();
    if (!b || b === BUILD) return;
    if (onStart && !sessionStorage.getItem("mtg-updated-to-" + b)){ sessionStorage.setItem("mtg-updated-to-" + b, "1"); location.replace(freshUrl(b)); return; }
    $("#updateBar").hidden = false; $("#updateBar").onclick = () => location.replace(freshUrl(b));
  } catch {}
}
checkForUpdate(true);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(false); });
setInterval(() => checkForUpdate(false), 10 * 60 * 1000);

applyZoom(); applySplit(); applyUiZoom();
load();
render();
renderDrive(); initGoogle();
idb.loadAll().then(() => { if (IMG.size) render(); });
