<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MTG Deck Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.17.0/css/mana.min.css">
<style>
/* MTG Deck Builder v4 — forest theme.
   Layout: deck list (left, collapsible) · header (commanders, combine cards, stats table, totals; shrinks to one line while you scroll)
   · toolbar (card size, sort, filter, move all) · two resizable panels: card pool and deck. */
:root{
  --bg:#0d0e14; --surface:#151722; --surface-2:#1c1f2d; --surface-3:#252939;
  --line:#2b2f43; --line-soft:#212436;
  --fg:#ece7da; --muted:#9a9cb3; --faint:#6b6e86;
  --gold:#d9ab4f; --gold-soft:rgba(217,171,79,.14); --gold-line:rgba(217,171,79,.45);
  --leaf:#a9c4ea; --ok:#55c48f; --danger:#ef5a5f; --danger-soft:rgba(239,90,95,.14);
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius-card:4.6%;
  --tile:180px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
img{max-width:100%}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;height:100%;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ---------- Sidebar ---------- */
#sidebar{width:272px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin .22s ease;z-index:30}
#app.side-closed #sidebar{margin-left:-272px}
.side-rail{display:none}
.panel-btn{color:var(--muted)}
.panel-btn:hover{color:var(--gold)}
@media (min-width:821px){
  #sidebar{transition:width .22s ease}
  #app.side-closed #sidebar{margin-left:0;width:58px;overflow:hidden}
  #app.side-closed #sidebar>:not(.side-rail){display:none!important}
  #app.side-closed .side-rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 0}
  .rail-brand{color:var(--gold);font-size:22px}
  #openSide,#railMenu{display:none!important}
}
.side-head{padding:18px 16px 12px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.05em;font-size:16px;white-space:nowrap;color:var(--gold);display:flex;align-items:center;gap:8px}
.brand .ms{font-size:20px}
.side-head .icon-btn{margin-left:auto}
.side-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 16px 6px}
#deckList{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:4px}
.deck-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.deck-item:hover{background:var(--surface-2)}
.deck-item.active{background:var(--gold-soft);border-color:var(--gold-line)}
.deck-thumb{width:44px;height:44px;border-radius:8px;background:var(--surface-3) center/cover;flex:none;display:grid;place-items:center;color:var(--faint)}
.deck-meta{min-width:0;flex:1}
.deck-meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-meta small{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.deck-meta .pips{display:inline-flex;gap:1px;font-size:10px}
.deck-acts{display:flex;gap:0}
.deck-item:not(:hover):not(.active) .deck-acts{display:none}
.deck-acts button{color:var(--faint);background:none;border:0;padding:5px;border-radius:6px;display:grid;place-items:center}
.deck-acts button:hover{color:var(--fg);background:var(--surface-3)}
.deck-acts button.del:hover{color:var(--danger);background:var(--danger-soft)}
.deck-acts svg.i{width:16px;height:16px}
.deck-rename{width:100%;background:var(--surface-3);border:1px solid var(--gold-line);border-radius:6px;padding:3px 6px;font-weight:600}
.new-deck{margin:4px 8px 8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;border:1px dashed var(--gold-line);background:none;color:var(--gold);font-weight:600}
.new-deck:hover{background:var(--gold-soft)}
.side-foot{border-top:1px solid var(--line);padding:12px;display:grid;gap:6px}
.side-foot .btn{justify-content:flex-start}
.side-note{font-size:11.5px;color:var(--faint);line-height:1.4;padding:2px 4px 0}
.side-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);padding:2px 4px}
.side-row select{flex:1;font-size:12.5px;padding:4px 6px}
.drive-box{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:4px}
.drv-title{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.drv-title svg.i{width:16px;height:16px}
.drv-note{font-size:12px;color:var(--muted);line-height:1.45;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drv-note b{color:var(--fg);font-weight:600}
.drv-note a{color:var(--gold);text-decoration:none;word-break:break-word}
.drv-note a:hover{text-decoration:underline}
.drive-box .btn{justify-content:center}
.drv-main{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold);font-weight:600}
.drv-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drv-row .link-btn{font-size:12px}
.drv-status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg)}
.drv-status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(85,196,143,.15)}
.drv-status.syncing i,.drv-status.pending i{background:var(--gold);animation:pulseDot 1s ease-in-out infinite}
.drv-status.error{color:var(--danger)}
.drv-status.error i{background:var(--danger)}
@keyframes pulseDot{50%{opacity:.35}}
.drv-role{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.drv-role.ed{color:var(--ok);border-color:rgba(85,196,143,.4)}
.drv-role.vw{color:var(--gold);border-color:var(--gold-line)}
.deck-meta .by{color:var(--leaf)}
.avatar{width:28px;height:28px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;border:1px solid var(--line)}
.avatar.xs{width:18px;height:18px;font-size:9px;margin-right:6px;vertical-align:-4px}
.side-label{display:flex;align-items:center}
.profile{display:flex;align-items:center;gap:10px;margin:0 8px 10px;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.profile .pf-text{flex:1;min-width:0;display:flex;flex-direction:column}
.profile .pf-text b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile .pf-text small{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pf-status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pf-status.syncing i,.pf-status.pending i{background:var(--gold);animation:pulseDot 1s ease-in-out infinite}
.pf-status.error{color:var(--danger)}.pf-status.error i{background:var(--danger)}
.avatar.lg{width:38px;height:38px;font-size:15px}
.folders-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.folders-bar .link-btn{letter-spacing:0;text-transform:none;font-size:11.5px}
.folder{margin-bottom:4px}
.folder-head{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:10px;border:1px solid transparent;background:none;text-align:left}
.folder-head:hover{background:var(--surface-2);border-color:var(--line)}
.folder.mine>.folder-head{background:var(--gold-soft);border-color:var(--gold-line)}
.folder-head .chev{display:grid;place-items:center;color:var(--faint);transition:transform .2s;transform:rotate(-90deg)}
.folder.open>.folder-head .chev{transform:none}
.folder-head .chev svg.i{width:14px;height:14px}
.folder-head .p-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder-head .p-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:14px;text-align:right}
.folder-body{margin:4px 0 6px 18px;padding-left:8px;border-left:2px solid var(--line-soft);display:flex;flex-direction:column;gap:3px}
.folder.mine .folder-body{border-left-color:var(--gold-line)}
.new-deck.in-folder{margin:2px 0 4px;padding:7px 10px;justify-content:flex-start;font-size:13px}
.folder-empty{padding:4px 8px 6px}
.person{display:flex;align-items:center;gap:9px;width:calc(100% - 4px);margin:6px 2px 2px;padding:7px 8px;border-radius:10px;border:1px solid transparent;background:none;text-align:left}
.person:hover{background:var(--surface-2);border-color:var(--line)}
.person.open{background:var(--surface-2)}
.person .p-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person.me{cursor:default;background:var(--gold-soft);border-color:var(--gold-line);margin-top:2px}
.person .p-role.you{color:var(--gold);border-color:var(--gold-line)}
.people-hint{padding:8px 10px 4px;font-size:11.5px}
.person .p-role{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.person .p-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.person svg.i{width:15px;height:15px;color:var(--faint);transition:transform .2s;transform:rotate(-90deg)}
.person.open svg.i{transform:none}
.person-decks{padding-left:10px;border-left:2px solid var(--line-soft);margin-left:16px;display:flex;flex-direction:column;gap:4px}
.ro-banner{order:1;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(120,140,255,.08);border:1px solid rgba(140,160,255,.3)}
.ro-banner span{display:flex;flex-direction:column;min-width:0;flex:1}
.ro-banner b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro-banner small{font-size:11.5px;color:var(--muted)}
.ro-banner{flex-wrap:wrap}
.ro-banner .btn{flex:1 1 100%;justify-content:center}
body.ro .acts,body.ro .add-tile,body.ro #addAny,body.ro #wipeBtn,body.ro #tools .moves,body.ro .cmd-col .acts,body.ro #comboAdd,body.ro .mini .x,body.ro #useSugg,body.ro #addBasics,body.ro .cmd-slot.partner.empty{display:none!important}
body.ro .box-grip{visibility:hidden}
body.ro #stats input{pointer-events:none;opacity:.6}
body.ro .name-wrap{border-style:solid;border-color:transparent;cursor:default}
body.ro .name-wrap svg{display:none}
.pricey-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;padding:6px 9px;border-radius:9px;background:var(--pricey-soft);border:1px solid var(--pricey-line);color:#e2d3ff;font-size:12.5px;font-weight:600;cursor:text;white-space:nowrap}
.cur-sel{background:rgba(0,0,0,.25);border:1px solid var(--pricey-line);border-radius:6px;color:#fff;font-weight:700;font-size:13px;padding:1px 3px}
.pricey-row .pr-count{color:var(--muted);font-weight:500}
.pricey-row input{width:56px;background:rgba(0,0,0,.25);border:1px solid var(--pricey-line);border-radius:6px;padding:2px 5px;text-align:right;font-size:13px;font-weight:700;color:#fff;-moz-appearance:textfield}
.pricey-row input:focus{outline:none;border-color:#d7c2ff}
.pricey-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pricey-row input:disabled{opacity:.75}
.pricey-set{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:text}
.pricey-set input{width:48px;background:var(--surface-3);border:1px solid transparent;border-radius:6px;padding:1px 4px;text-align:right;font-size:12px;color:#e2d3ff;-moz-appearance:textfield}
.pricey-set input:focus{border-color:var(--pricey-line);outline:none}
.pricey-set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pricey-set input:disabled{opacity:.7}
.backup summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:4px 4px;list-style:none;display:flex;align-items:center;gap:6px}
.backup summary::-webkit-details-marker{display:none}
.backup summary::before{content:"›";display:inline-block;transition:transform .2s;color:var(--faint)}
.backup[open] summary::before{transform:rotate(90deg)}
.backup summary:hover{color:var(--fg)}
.backup-body{display:grid;gap:6px;padding-top:6px}
.gate{gap:16px}
.gate h1{font-size:26px}
.gate-logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold);font-size:32px}
.gate-note{margin:0;color:var(--muted);max-width:420px;line-height:1.55}
.gate-btn{padding:11px 20px;font-size:15px}
.gate-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gate-spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.unsaved-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:auto;box-shadow:0 0 0 3px var(--gold-soft)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--gold-line);background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.primary{background:var(--gold);color:#1b1407;border-color:var(--gold);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.on{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--fg);background:var(--surface-2);border-color:var(--line)}
.icon-btn.on{color:var(--gold)}
.card-plus-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:10px;border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold);font-weight:600;white-space:nowrap}
.card-plus-btn:hover{background:rgba(217,171,79,.24)}
.card-plus-ico{width:20px;height:27px;border:1.8px solid currentColor;border-radius:3px;display:grid;place-items:center;font-size:16px;line-height:1;font-weight:700;flex:none}

/* ---------- Header ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#top{flex:none;position:relative;background:linear-gradient(180deg,#171a27,#12141d);border-bottom:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"cmds name stats total" "cmds combo stats total";grid-template-rows:auto 1fr;column-gap:20px;row-gap:10px;align-items:start}
.cmds{grid-area:cmds;display:flex;gap:8px;align-items:flex-start}
.cmd-col{display:flex;flex-direction:column;gap:6px;min-width:0;flex:0 1 auto}
.cmd-col .acts{width:100%}
.cmd-slot{width:118px;flex:none;aspect-ratio:63/88;border-radius:6px;overflow:hidden;position:relative;background:var(--surface-2);border:1px solid var(--line);padding:0;box-shadow:0 8px 22px rgba(0,0,0,.5);transition:transform .15s}
.cmd-slot:hover{transform:translateY(-2px)}
.cmd-slot img{width:100%;height:100%;object-fit:cover;display:block}
.cmd-slot.empty{border:1.5px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;box-shadow:none}
.cmd-slot.empty .card-plus-ico{width:26px;height:35px;font-size:20px;margin:0 auto 6px}
.cmd-slot.partner.empty{width:84px;font-size:11px}
.cmd-lbl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#f1ead5;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:14px 4px 4px;text-align:center}
.name-row{grid-area:name;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.name-wrap{flex:1 1 220px;min-width:0;max-width:440px;display:flex;align-items:center;gap:6px;border:1px dashed var(--line);border-radius:9px;padding:0 10px 0 0;cursor:text}
.name-wrap:hover,.name-wrap:focus-within{border:1px solid var(--gold-line);background:var(--surface)}
.name-wrap svg{color:var(--muted)}
.name-wrap:hover svg,.name-wrap:focus-within svg{color:var(--gold)}
#deckName{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:6px 8px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em}
.top-actions{display:flex;gap:6px;align-items:center}
.combo{grid-area:combo;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;min-width:0}
.combo-lbl{display:flex;flex-direction:column;gap:2px;max-width:190px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.combo-lbl small{font-size:11.5px;color:var(--muted);line-height:1.35}
.mini{width:58px;aspect-ratio:63/88;border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--gold-line);background:var(--surface-2);padding:0;flex:none}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.78);display:grid;place-items:center;font-size:12px;line-height:1;color:#fff}
.mini.empty{border:1.5px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:20px;font-weight:600}
.mini.empty:hover{background:rgba(217,171,79,.24)}
#total{grid-area:total;display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:92px}
#total b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
#total b span{color:var(--faint);font-size:16px}
#total small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#total.full b{color:var(--ok)}
#total.over b{color:var(--danger)}
.tot-sub{display:flex;flex-direction:column;align-items:flex-end;gap:3px;margin-top:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tot-sub span{display:inline-flex;align-items:center;gap:5px}
.tot-sub svg.i{width:13px;height:13px;color:var(--gold)}
.tot-sub b{font-family:var(--body);font-size:13px;color:var(--fg)}

/* stats table */
#stats{grid-area:stats;border-left:1px solid var(--line);padding-left:16px;min-width:0}
.stbl{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.stbl th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 6px 3px;text-align:center;white-space:nowrap}
.stbl th.l{text-align:left}
.stbl td{padding:0 6px;height:21px;white-space:nowrap}
.stbl td.ic{width:18px;padding:0 2px;text-align:center;color:var(--muted)}
.stbl td.sname{color:#d9d4c3}
.stbl td.num{text-align:center}
.stbl td.lk{color:var(--gold)}
.stbl tr.over td.dn{color:var(--danger);font-weight:700}
.stbl tr.over{background:var(--danger-soft)}
.stbl tr.met td.dn{color:var(--ok);font-weight:600}
.stbl tr.sub td{height:18px;font-size:11.5px;color:var(--muted)}
.stbl tr.sub td.sname{padding-left:14px;color:var(--muted)}
.stbl input{width:40px;height:19px;background:var(--surface-3);border:1px solid transparent;border-radius:5px;padding:0 2px;text-align:center;font-size:12px;color:var(--muted);-moz-appearance:textfield}
.stbl input::-webkit-inner-spin-button,.stbl input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stbl input:focus{border-color:var(--gold-line);outline:none;color:var(--fg)}
.stbl td.edh{text-align:left;color:var(--leaf)}
.delta{display:inline-block;min-width:22px;font-size:10.5px;text-align:center;border-radius:5px;margin-left:4px;color:var(--faint);font-style:normal}
.delta.up{color:var(--ok);background:rgba(85,196,143,.12)}
.delta.down{color:var(--gold);background:var(--gold-soft)}
.stats-foot{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:5px;font-size:11.5px;color:var(--muted);max-width:380px}
.colors{display:flex;gap:8px;align-items:center}
.colors span{display:inline-flex;align-items:center;gap:3px;color:var(--fg)}
.sumline.bad{color:var(--danger)}
.sumline.good{color:var(--ok)}
.basis-line{flex-basis:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.pill-btn{border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold);border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:600}
.pill-btn:hover{background:rgba(217,171,79,.24)}
.pill-btn:disabled{border-color:transparent;background:none;color:var(--ok);cursor:default}

/* ---------- Toolbar ---------- */
#tools{flex:none;display:flex;align-items:center;gap:8px 14px;padding:8px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:#11131c;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.tool .tl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.tool select{font-size:13px}
.tool.size{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:999px;padding:4px 12px 4px 12px;color:var(--gold);cursor:pointer}
.tool.size .tl{color:var(--gold)}
.z-ico{width:9px;height:12px;border:1.6px solid currentColor;border-radius:2px;flex:none}
.z-ico.big{width:13px;height:18px}
.tool.size input{width:120px;accent-color:var(--gold);margin:0;cursor:pointer}
.tool.size output{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tool.filter{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 4px 0 9px}
.tool.filter:focus-within{border-color:var(--gold-line)}
.tool.filter input{width:120px;background:none;border:0;outline:none;padding:6px 0;font-size:13px}
.tool.filter select{border:0;background:var(--surface-3);max-width:140px;font-size:12.5px;padding:3px 6px}
.tool.filter.on{border-color:var(--gold)}
.tool.moves .btn{padding:5px 10px;font-size:12.5px}
.tools-gap{flex:1}

/* ---------- Board ---------- */
#board{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,var(--sp,50%)) 10px minmax(0,1fr)}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 60px;overscroll-behavior:contain}
.panel-head{position:sticky;top:0;z-index:6;height:42px;margin:0 -14px;padding:0 14px;display:flex;align-items:center;gap:10px;background:rgba(13,14,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
.panel-head h2{margin:0;font-family:var(--display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.ph-meta,.box-right,.box-count{white-space:nowrap}
.ph-meta{overflow:hidden;text-overflow:ellipsis;min-width:0}
.box-head h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph-meta{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.jump{margin-left:auto;display:flex;justify-content:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 0}
.panel-head .ph-meta{flex:0 0 auto}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:none;color:var(--faint);display:grid;place-items:center;padding:0;transition:color .15s,background .15s,border-color .15s}
.jump button .ms{font-size:14px}
.jump button:hover{color:var(--fg);background:var(--surface-2);border-color:var(--line)}
.jump button.on{color:var(--gold);background:var(--gold-soft);border-color:var(--gold-line)}
.panel.drop-target .panel-scroll{background:rgba(217,171,79,.03)}
.splitter{position:relative;cursor:col-resize;touch-action:none;display:grid;place-items:center}
.splitter::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
.splitter i{position:relative;width:6px;height:46px;border-radius:4px;background:var(--surface-3);border:1px solid var(--line);transition:background .15s}
.splitter:hover i,.splitter.on i{background:var(--gold)}

.box{border:1px solid var(--line-soft);border-radius:12px;background:var(--surface);margin-top:12px;position:relative}
.box-head{position:sticky;top:42px;z-index:4;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 4px;border-bottom:1px solid var(--line-soft);min-height:42px;background:rgba(21,23,34,.97);border-radius:12px 12px 0 0;backdrop-filter:blur(6px)}
.box-grip{display:grid;place-items:center;width:28px;height:30px;border-radius:6px;color:var(--faint);cursor:grab;touch-action:none;background:none;border:0;padding:0}
.box-grip:hover{color:var(--fg);background:var(--surface-3)}
.box-head .ms{font-size:16px;color:var(--gold)}
.box-head{cursor:pointer;user-select:none;-webkit-user-select:none}
.box-head:hover h3{color:var(--gold)}
.box-fold{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--muted);transition:transform .2s ease,color .15s}
.box-head:hover .box-fold{color:var(--gold);background:var(--surface-3)}
.box.collapsed .box-fold{transform:rotate(-90deg)}
.box-fold svg.i{width:16px;height:16px}
.box.collapsed .grid{display:none}
.box.collapsed .box-head{border-bottom-color:transparent;border-radius:12px}
.box.collapsed{background:rgba(21,23,34,.6)}
.jump button.folded{opacity:.45}
.box-head h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.04em}
.box-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.box-lk{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.box-lk svg.i{width:13px;height:13px}
.box-count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.box-count.over{color:var(--danger);font-weight:600}
.box-count.met{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--tile));justify-content:start;gap:16px 12px;padding:12px}
.box.ins-top::before,.box.ins-bottom::after{content:"";position:absolute;left:8px;right:8px;height:3px;border-radius:3px;background:var(--gold)}
.box.ins-top::before{top:-8px}.box.ins-bottom::after{bottom:-8px}
.box.target{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
.lock-sep{grid-column:1/-1;height:0;border-top:1px dashed var(--gold-line);margin:-4px 0;opacity:.6}

.cw{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;container-type:inline-size}
.cw.ins-before::before,.cw.ins-after::before{content:"";position:absolute;top:2%;height:calc(var(--tile)*1.3);max-height:80%;width:4px;border-radius:3px;background:var(--gold);z-index:3}
.cw.ins-before::before{left:-8px}.cw.ins-after::before{right:-8px}
.cw.dragging{opacity:.28;outline:2px dashed var(--gold-line);outline-offset:3px;border-radius:6px}
.ct{position:relative;aspect-ratio:63/88;border-radius:var(--radius-card);background:var(--surface-3);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;box-shadow:0 3px 10px rgba(0,0,0,.45);transition:transform .14s ease,box-shadow .14s ease}
@media (hover:hover){.ct:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.55),0 0 0 1px rgba(217,171,79,.25)}}
.ct img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ct-name{position:absolute;inset:0;padding:8px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.cw.over .ct{outline:3px solid var(--danger);outline-offset:-1px}
.cw.over .ct::after{content:"Over limit";position:absolute;left:0;right:0;bottom:0;background:var(--danger);color:#fff;font-size:10px;font-weight:700;text-align:center;letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.cw.locked .ct{box-shadow:0 0 0 2px var(--gold),0 3px 10px rgba(0,0,0,.45)}
.cw.lifted .ct{transform:scale(1.06);box-shadow:0 0 0 3px var(--gold),0 12px 26px rgba(0,0,0,.6)}
.ct-badges{position:absolute;top:47%;left:6px;display:flex;flex-direction:column;gap:3px;z-index:2}
.ct-badges i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,14,.85);color:var(--gold);border:1px solid var(--gold-line)}
.ct-badges svg.i{width:13px;height:13px}
.custom-tag{position:absolute;right:5px;top:5px;z-index:2;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,14,.85);color:var(--gold);border:1px solid var(--gold-line)}
.custom-tag svg.i{width:12px;height:12px}
/* stats under each card */
.ct-stats{display:grid;gap:3px;font-size:11px;line-height:1.15;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 1px}
.st-row{display:flex;align-items:baseline;gap:4px;white-space:nowrap;overflow:hidden}
.st-row b{color:var(--fg);font-weight:700}
.st-row .syn.pos{color:var(--ok)}
.st-row .syn.neg{color:var(--danger)}
.st-row .price{margin-left:auto;color:#e9d9a8;font-weight:600}
/* expensive cards: purple */
:root{--pricey:#b48cff;--pricey-soft:rgba(160,110,255,.18);--pricey-line:rgba(180,140,255,.5)}
.price.pricey{color:#e2d3ff!important;background:var(--pricey-soft);border:1px solid var(--pricey-line);border-radius:999px;padding:0 6px}
.st-row .price.pricey{padding:0 5px}
.cw.pricey .ct{outline:3px solid var(--pricey);outline-offset:-1px;box-shadow:0 0 18px -2px rgba(160,110,255,.65),0 3px 10px rgba(0,0,0,.45)}
.cw.pricey.locked .ct{box-shadow:0 0 0 3px var(--gold),0 0 20px 0 rgba(160,110,255,.6)}
.cw.over.pricey .ct{outline-color:var(--danger)}
.qty{position:absolute;right:4%;top:3%;z-index:3;display:flex;align-items:center;border-radius:999px;background:rgba(10,10,14,.88);border:1px solid var(--gold-line);box-shadow:0 4px 14px rgba(0,0,0,.55);overflow:hidden}
.qty b{min-width:26px;text-align:center;font-size:14px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.qty button{width:26px;height:26px;border:0;background:none;color:var(--gold);font-size:17px;font-weight:700;line-height:1;padding:0}
.qty button:hover{background:var(--gold-soft)}
@container (max-width:132px){.qty b{min-width:18px;font-size:12px}.qty button{width:20px;height:22px;font-size:14px}}
body.ro .qty button{display:none}
body.ro .qty b{padding:2px 8px}
.qty-big{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.qty-big b{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.qty-big button{width:34px;height:36px;border:0;background:none;color:var(--gold);font-size:18px;font-weight:700}
.qty-big button:hover{background:var(--gold-soft)}
.box.tokens{border-style:dashed}
.box.tokens .box-head .pill-btn{font-size:11px}
body.ro .box.tokens .pill-btn{display:none}
.pricey-tag{position:absolute;right:0;top:47%;z-index:2;padding:3px 8px 3px 9px;border-radius:999px 0 0 999px;background:linear-gradient(90deg,#7b4dff,#b06bff);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;box-shadow:0 4px 12px rgba(110,60,255,.55);white-space:nowrap;font-variant-numeric:tabular-nums}
@container (max-width:132px){.pricey-tag{font-size:9.5px;padding:2px 6px}}
.cw.pricey .ct-stats .bar{box-shadow:0 2px 8px -2px rgba(150,95,255,.0)}
.chip-st.price.pricey{border-color:var(--pricey-line);background:var(--pricey-soft)}
.chip-st.price.pricey b{color:#e2d3ff}
.ph-pricey{color:#d7c2ff}
.side-row input{width:64px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12.5px;margin-left:auto;text-align:right}
.side-row input:focus{border-color:var(--pricey-line);outline:none}
.st-row.faint{color:var(--faint)}
.ct-stats .bar{margin:0}
.sh{display:none}
@container (max-width:132px){.lg{display:none}.sh{display:inline}.ct-stats{font-size:10px}}
.acts{display:flex;gap:3px}
.acts .act-slot{flex:1}
.acts .del{margin-left:6px}
.acts button{flex:1;height:28px;border-radius:7px;border:1px solid var(--line-soft);background:var(--surface-2);display:grid;place-items:center;color:var(--muted);padding:0;min-width:0}
.acts button:hover{color:var(--fg);border-color:var(--gold-line)}
.acts button.on{color:var(--gold);border-color:var(--gold-line);background:var(--gold-soft)}
.acts button.move{color:var(--gold)}
.acts button.del:hover{color:var(--danger);border-color:var(--danger)}
.acts button:disabled{opacity:.3;cursor:default}
.acts svg.i{width:15px;height:15px}
body.pulse-focus .acts [data-act="focus"]{animation:pulse 1.1s ease 2}
@keyframes pulse{50%{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}}
.add-tile{aspect-ratio:63/88;border-radius:var(--radius-card);border:1.5px dashed var(--gold-line);background:none;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;padding:6px;text-align:center;transition:background .15s}
.add-tile:hover{background:var(--gold-soft)}
.add-tile .card-plus-ico{width:28px;height:38px;font-size:20px}
.bar{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b99447,var(--gold))}
.bar.syn i{background:linear-gradient(90deg,#3f9a70,var(--ok))}
.empty-note{padding:16px 12px;color:var(--faint);font-size:13px}

.ghost{position:fixed;top:0;left:0;z-index:1000;pointer-events:none;box-shadow:0 18px 40px rgba(0,0,0,.6);opacity:.95}
.ghost,.ghost *{transition:none!important;animation:none!important}
.fly{position:fixed;z-index:400;transform-origin:0 0;pointer-events:none}
img.fly{object-fit:cover;border-radius:4.6%/3.3%;box-shadow:0 18px 44px rgba(0,0,0,.6)}
.fly .face{display:block;width:100%;height:100%;object-fit:cover;border-radius:4.6%/3.3%;box-shadow:0 18px 44px rgba(0,0,0,.6)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important}
body.is-dragging .panel-scroll{touch-action:none}
body.splitting,body.splitting *{cursor:col-resize!important;user-select:none!important}
#hoverPrev{position:fixed;z-index:900;width:300px;aspect-ratio:63/88;border-radius:14px;pointer-events:none;box-shadow:0 20px 50px rgba(0,0,0,.7);background:var(--surface-3);top:0;left:0}

/* ---------- Welcome ---------- */
#welcome{flex:1;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.welcome-card{max-width:540px;text-align:center;display:grid;gap:14px;justify-items:center}
.welcome-card h1{margin:0;font-family:var(--display);font-size:28px;letter-spacing:.04em;text-wrap:balance}
.steps{display:grid;gap:8px;text-align:left;margin:6px 0 4px;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;color:#d9d4c3;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--gold-line);color:var(--gold);display:grid;place-items:center;font-size:12px;font-weight:600}
.big-slot{width:160px;aspect-ratio:63/88;border-radius:10px;border:1.5px dashed var(--gold-line);background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;align-content:center;gap:10px;font-weight:600}
.big-slot .card-plus-ico{width:40px;height:54px;font-size:28px}

/* ---------- Modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.72);backdrop-filter:blur(3px);z-index:200;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.scrim:not([hidden]){animation:fade .16s ease-out}
.scrim:not([hidden])>.modal{animation:rise .22s cubic-bezier(.2,.8,.2,1)}
#detailScrim:not([hidden])>.modal{animation:none}
#detailScrim{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(5,6,10,.84)}
.fly{will-change:transform,opacity;backface-visibility:hidden}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(1140px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);min-height:0}
#addModal{height:100%}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);min-width:0}
.modal-head h2{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.modal-head .icon-btn{margin-left:auto}
.modal-top{padding:12px 16px 0;display:grid;gap:10px}
.modal-body{padding:12px 16px 18px;overflow-y:auto;min-height:0;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;flex:none}
.chip .ms{color:var(--muted)}
.chip:hover{border-color:var(--gold-line)}
.chip.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.chip.on .ms{color:var(--gold)}
.searchrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 12px}
.search:focus-within{border-color:var(--gold-line)}
.search input{flex:1;min-width:0;background:none;border:0;padding:11px 0;outline:none;font-size:15px}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{border:0;background:none;color:var(--muted);padding:6px;border-radius:6px;display:grid;place-items:center}
.search .clear:hover{color:var(--fg)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--gold);width:16px;height:16px}
.basis{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.basis b{color:var(--fg);font-weight:600}
.basis select{margin-left:auto;font-size:12.5px}
.namefield{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.namefield input{flex:1;min-width:200px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:15px}
.namefield input:focus{border-color:var(--gold-line);outline:none}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px 14px}
.rt{display:flex;flex-direction:column;gap:6px;min-width:0;animation:fade .25s ease-out}
.rt-img{aspect-ratio:63/88;border-radius:var(--radius-card);overflow:hidden;background:var(--surface-3);border:0;padding:0;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .14s}
.rt-img:hover{transform:translateY(-3px)}
.rt-img img{width:100%;height:100%;object-fit:cover;display:block}
.rt-img .tag{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(10,10,14,.85);color:var(--gold);border:1px solid var(--gold-line)}
.rt-meta{font-size:12px;color:var(--muted);line-height:1.35;min-height:32px}
.rt-meta b{color:var(--fg);font-weight:600;display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-meta .price{float:right;color:#e9d9a8;font-weight:600}
.rt-acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rt-acts .btn{justify-content:center;padding:7px 6px;font-size:12.5px}
.rt-acts .done{grid-column:1/-1;justify-content:center;color:var(--ok);background:none;border-color:transparent}
.skel{aspect-ratio:63/88;border-radius:var(--radius-card);background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-150% 0}}
.notice{padding:18px;border-radius:10px;background:var(--surface-2);color:var(--muted);text-align:center;line-height:1.55}
.more{display:flex;justify-content:center;margin-top:16px}

/* ---------- Card view: cover flow on top, details and edits below ---------- */
.detail{width:min(960px,100%);max-height:100%;background:none;border:0;box-shadow:none}
.detail .dv-scroll{position:relative;scrollbar-width:thin}
.dv-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);margin-top:8px}
.dv-box .modal-head{flex-wrap:wrap}
.dv-x{position:absolute;right:4px;top:4px;z-index:300;background:rgba(10,10,14,.6);color:var(--fg)}
.detail .flow-foot{border:0;padding:6px 8px 4px;color:var(--muted)}
#detailScrim{background:rgba(5,6,10,.88)}
.dv-scroll{overflow-y:auto;min-height:0;flex:1}
.flow{--flw:250px;position:relative;height:calc(var(--flw) * 1.397 * 1.2 + 34px);perspective:1100px;overflow:hidden;background:none;--old-bg:radial-gradient(ellipse at 50% 28%,#20243a,#0b0c12 72%);outline:none;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.flow:focus-visible{box-shadow:inset 0 0 0 2px var(--gold)}
.flow-stage{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.flow-stage.instant .fl{transition:none!important}
.fl{position:absolute;left:50%;top:22px;width:var(--flw);aspect-ratio:63/88;border:0;padding:0;background:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s;cursor:pointer}
.fl .face{width:100%;height:100%;object-fit:cover;border-radius:4.6%/3.3%;display:block;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.6);opacity:0;transition:opacity .35s ease}
.fl .face.ld{opacity:1}
.fl .refl{transition:opacity .35s ease}
.fl .refl:not(.ld){opacity:0!important}
/* our own mirrored reflection: always there, in every browser */
.fl .refl,.fly .refl{position:absolute;left:0;top:calc(100% + 4px);width:100%;height:100%;object-fit:cover;border-radius:4.6%/3.3%;transform:scaleY(-1);pointer-events:none;opacity:.22;
  -webkit-mask-image:linear-gradient(to bottom,transparent 76%,#000);mask-image:linear-gradient(to bottom,transparent 76%,#000)}
.fl .yours{position:absolute;left:50%;top:-20px;transform:translateX(-50%);padding:2px 9px;border-radius:999px;background:linear-gradient(90deg,#c9963a,var(--gold));color:#1b1407;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.5);pointer-events:none}
.fl-over.rebasing canvas{outline:2px dashed var(--gold);outline-offset:4px}
.rebase-cap{color:var(--gold)}
.base-name{max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl:not(.center){filter:brightness(.5) saturate(.85)}
.fl-over{position:absolute;left:50%;top:22px;width:var(--flw);aspect-ratio:63/88;transform:translateX(-50%);pointer-events:none;z-index:150}
.fl-over canvas{width:100%;height:100%;border-radius:4.6%/3.3%;display:none;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.6)}
.fl-over.custom canvas{display:block}
.fl-over.user canvas{pointer-events:auto;cursor:move;touch-action:none}
.fl-over.stale canvas,.fl-over.stale .name-over,.fl-over.stale .name-pen{display:none}
.name-over{position:absolute;left:7.2%;top:5.1%;width:63%;height:5%;pointer-events:auto;font:700 calc(var(--flw) * .047) Georgia,"Times New Roman",serif;padding:0 5px;border-radius:4px;border:1px dashed transparent;background:transparent;color:transparent;caret-color:var(--gold);cursor:text}
.name-over{border-color:rgba(217,171,79,.6)!important}
.name-over:focus{border-color:var(--gold)!important}
.name-over::placeholder{color:transparent}
.name-pen{position:absolute;left:-14px;top:4.4%;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1b1407;border:2px solid var(--bg);display:grid;place-items:center;pointer-events:auto;padding:0;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .15s}
.name-pen:hover{transform:scale(1.1)}
.name-pen svg.i{width:14px;height:14px;stroke-width:2.2}
.name-over:hover{border-color:var(--gold);background:rgba(10,10,14,.25)}
.name-over:focus{outline:none;border-style:solid;border-color:var(--gold);background:rgba(10,10,14,.92);color:#f2ecd9}
.name-over:focus::placeholder{color:#8a8ca3}
@media (hover:none){.name-over{border-color:rgba(217,171,79,.55)}}
.flow-empty{display:grid;place-items:center;height:100%;color:var(--muted)}
.flow-foot{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.art-find{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:999px;padding:3px 6px 3px 12px;color:var(--gold);min-width:220px;flex:0 1 300px}
.art-find .af-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.art-find-old{padding:0 8px;flex:0 1 230px;min-width:150px}
.art-find:focus-within{border-color:var(--gold-line)}
.art-find svg.i{width:15px;height:15px;color:var(--gold)}
.art-find input{flex:1;min-width:0;background:rgba(0,0,0,.25);border:0;outline:none;padding:7px 10px;font-size:14px;border-radius:999px;color:var(--fg)}
.art-find:focus-within{box-shadow:0 0 0 3px var(--gold-soft)}
.flow-cap{font-size:12.5px;color:var(--muted);min-width:0;flex:1 1 260px}
.flow-cap b{color:var(--fg);font-weight:600}
.flow-cap .price{color:#e9d9a8;font-weight:600}
.flow-scrub{flex:2 1 220px;accent-color:var(--gold);height:20px;cursor:pointer;margin:0}
.dv-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:16px 18px 18px;align-items:start}
.dv-info{display:flex;flex-direction:column;gap:10px;min-width:0}
.type-line{color:var(--muted);font-size:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.oracle{white-space:pre-line;line-height:1.6;font-size:14.5px;color:#e0dacb}
.oracle .ms{font-size:.85em}
.mana .ms{font-size:15px;margin-right:1px}
.pt{font-weight:700;font-size:15px}
.note{color:var(--muted);font-size:13px}
.dv-stats{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px}
.dv-stat{display:grid;grid-template-columns:92px 1fr 64px;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.dv-stat b{color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
.dv-stat .bar{height:6px;margin:0}
.dv-links{display:flex;gap:14px;flex-wrap:wrap}
.dv-links a{color:var(--gold);font-size:13px;text-decoration:none}
.dv-links a:hover{text-decoration:underline}
.dv-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.dv-acts{display:flex;flex-wrap:wrap;gap:8px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.chip-st{display:inline-flex;align-items:baseline;gap:5px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--muted);cursor:help;font-variant-numeric:tabular-nums}
.chip-st b{color:var(--fg)}
.chip-st b.pos{color:var(--ok)}.chip-st b.neg{color:var(--danger)}
.chip-st.price b{color:#e9d9a8}
.dv-edit{position:relative;display:grid;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid rgba(217,171,79,.28);
  background:radial-gradient(120% 140% at 0% 0%,rgba(217,171,79,.10),transparent 55%),linear-gradient(180deg,#1f2232,#191b28);
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);transition:border-color .25s,box-shadow .25s}
.dv-edit.dirty{border-color:var(--gold-line);box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 3px rgba(217,171,79,.10),inset 0 1px 0 rgba(255,255,255,.05)}
.ed-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px 10px;flex-wrap:wrap}
.ed-title{white-space:nowrap}
.ed-hint{text-align:right;margin-left:auto}
.ed-title{font-family:var(--display);font-weight:700;letter-spacing:.08em;color:var(--gold);font-size:14px;text-shadow:0 0 14px rgba(217,171,79,.35)}
.ed-hint{font-size:12px;color:var(--faint)}
.dv-edit.dirty .ed-hint{color:var(--gold)}
.ed-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:2px}
.ed-save{display:flex;gap:8px;margin-left:auto}
.ed-left{display:flex;gap:8px;flex-wrap:wrap}
.link-btn{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--danger)}
.save-btn{background:var(--surface-3);color:var(--faint);border-color:var(--line);font-weight:600}
.save-btn:not(:disabled){background:linear-gradient(180deg,#e6bd62,var(--gold));color:#1b1407;border-color:var(--gold);box-shadow:0 0 18px rgba(217,171,79,.35);animation:glow 2.4s ease-in-out infinite}
.save-btn:not(:disabled):hover{filter:brightness(1.08)}
@keyframes glow{50%{box-shadow:0 0 26px rgba(217,171,79,.55)}}
.ed-row{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center}
.ed-lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600}
.ed-lbl svg.i{width:14px;height:14px}
.ed-field{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0 4px 0 10px;min-width:0}
.ed-field:focus-within{border-color:var(--gold-line)}
.ed-field input{flex:1;min-width:0;background:none;border:0;outline:none;padding:8px 0;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:14px}
.ed-field input::placeholder{color:var(--faint);font-weight:400}
.ed-field .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.ed-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.ed-btns input[type=range]{flex:1;min-width:90px;accent-color:var(--gold)}

.art-sec{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line-soft)}
.art-sec h3{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.art-sec p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.art-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.art-row input[type=range]{flex:1;min-width:120px;accent-color:var(--gold)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600}
.seg button.on{background:var(--surface-3);color:var(--fg)}
.dv-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line-soft)}
.save-state{font-size:12px;color:var(--faint);margin-right:auto}
.save-state.dirty{color:var(--gold)}

/* confirm, report, pdf */
.confirm{width:min(460px,100%)}
.confirm .modal-body{display:grid;gap:12px}
.confirm h2{font-family:var(--display);margin:0;font-size:19px}
.confirm p{margin:0;color:var(--muted);line-height:1.55}
.confirm .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.step-dots{display:flex;gap:6px}.step-dots i{width:22px;height:4px;border-radius:3px;background:var(--surface-3)}.step-dots i.on{background:var(--danger)}
.progress{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
.report{margin:0;padding-left:18px;color:var(--fg);line-height:1.6}
.pdfm{width:min(1100px,100%);height:100%}
.pdf-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.pdf-top p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;flex:1 1 360px}
.pdf-top b{color:var(--fg)}
.pdf-pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;padding:20px;background:radial-gradient(ellipse at 50% 0%,#1b1e2e,#0b0c12 70%)}
.a4{position:relative;aspect-ratio:210/297;background:#fbfaf6;border-radius:3px;box-shadow:0 14px 34px rgba(0,0,0,.55);overflow:hidden;animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.a4 img,.a4 .ph{position:absolute;width:30%;height:29.63%;object-fit:cover;border-radius:1.2%/0.9%}
.a4 .ph{background:#e7e4da;display:grid;place-items:center;font-size:9px;color:#555;text-align:center;padding:4px}
.a4 .cut{position:absolute;background:#9a9a9a}
.a4 .pg{position:absolute;right:5%;top:1%;font-size:9px;color:#666}
.a4 .ruler{position:absolute;left:5%;bottom:1.6%;width:23.8%;height:2px;background:#555}
.pdf-cap{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.pdf-foot{display:flex;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pdf-foot .progress{flex:1;min-width:120px}
#pdfMsg{font-size:13px;color:var(--muted);flex:1 1 200px}

#updateBar{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:600;padding:9px 16px;border-radius:999px;border:1px solid var(--gold-line);background:var(--surface-3);color:var(--fg);font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise .25s ease-out}
#updateBar b{color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:500;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
#sideScrim{display:none}

/* ---------- folded commander panel (rail) ---------- */

#top.mini>*:not(#rail){display:none!important}
#top.mini #rail{display:flex}
.r-thumb{padding:0;border:0;background:none;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.5)}

.r-tot{font-variant-numeric:tabular-nums;white-space:nowrap}
.r-tot b{font-family:var(--display);font-size:22px}
.r-tot span{color:var(--faint);font-size:12px}
.r-tot.full b{color:var(--ok)}.r-tot.over b{color:var(--danger)}
.r-meta{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.r-meta svg.i{width:12px;height:12px;color:var(--gold)}
.r-types{display:flex;gap:4px}
.r-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.r-chip .ms{color:var(--muted);font-size:11px}

.r-chip.met{color:var(--ok)}

/* ---------- computers: the commander panel is a vertical column on the left ---------- */
@media (min-width:821px){

/* Inclusion % and synergy for every card on the commander's EDHREC page */
const edhStatCache = {};
function edhStats(d){
  if (!d || !d.commander) return null;
  const k = cmdKey(d);
  if (!(k in edhStatCache)){
    edhStatCache[k] = null;
    cmdPage(d).then(({j}) => {
      const m = new Map();
      for (const list of edhLists(j)) for (const cv of list.cardviews || []){
        const v = {incl: cv.potential_decks ? cv.num_decks / cv.potential_decks : 0, syn: cv.synergy ?? null};
        if (!m.has(cv.name)) m.set(cv.name, v);

async function buildRecs(d, bucket, focus){
  const page = await cmdPage(d);
  if (!page.j) throw new Error(`EDHREC has no page for ${cmdKey(d)} yet. You can still search for cards above.`);
  const sources = [{kind:"cmd", name: cmdKey(d), json: page.j}];
  const fj = await Promise.all(focus.map(n => edh(`cards/${slugify(n)}`)));
  focus.forEach((n, i) => sources.push({kind:"card", name: n, json: fj[i]}));
  const tags = EDH_TAGS[bucket];
  const skip = new Set(cmdrs(d).map(c => c.name));
  const map = new Map();
  for (const src of sources){
    if (!src.json) continue;
    const seen = new Set();
    for (const list of edhLists(src.json)){
      if (!tags.includes(list.tag)) continue;
      for (const cv of list.cardviews || []){
        if (seen.has(cv.name) || skip.has(cv.name)) continue; seen.add(cv.name);
        let e = map.get(cv.name);
        if (!e){ e = {name: cv.name, id: cv.id, score: 0, incl: null, syn: null, pairs: []}; map.set(cv.name, e); }
        const incl = cv.potential_decks ? cv.num_decks / cv.potential_decks : 0;
        if (src.kind === "cmd"){ e.incl = incl; e.syn = cv.synergy ?? null; e.score += incl + Math.max(0, cv.synergy || 0) * 1.2 + 0.25; }
        else { e.pairs.push(src.name); e.score += 0.35 + incl * 0.6; }

  const ci = new Set(deckCI(d));
  return ranked.map(e => ({...e, card: byId.get(e.id)}))
    .filter(e => e.card && e.card.ci.every(x => ci.has(x)) && (bucket === "Any" || bucketOf(e.card.type) === bucket));
}

/* ---------------- State & versioned merging ---------------- */
let S = {decks:{}, active:null, sidebarOpen: innerWidth > 820, lastFileSave:0, lastChange:0};
function ensureVer(d){ if (!d.ver) d.ver = uid(); if (!Array.isArray(d.past)) d.past = []; return d; }
function displayName(d){ return d.name || (d.commander ? cmdKey(d) : "Untitled deck"); }
/* Each deck carries its version id plus the ids of every earlier version.
   Incoming deck is: already known -> skip; a newer descendant of ours -> replace;
   otherwise both sides changed -> keep both, as "Name 1" (ours) and "Name 2" (theirs). */
function mergeDecks(incoming){
  const rep = {added: [], updated: [], conflicts: [], restored: [], kept: []};
  for (const raw of Object.values(incoming || {})){
    if (!raw || !raw.id) continue;
    const inc = ensureVer(JSON.parse(JSON.stringify(raw)));
    const all = Object.values(S.decks);
    if (all.some(L => L.ver === inc.ver || (L.past || []).includes(inc.ver))) continue;
    const L = S.decks[inc.id];
    if (!L){ if (!inc.deleted){ S.decks[inc.id] = inc; rep.added.push(displayName(inc)); } else S.decks[inc.id] = inc; continue; }
    ensureVer(L);
    if (inc.past.includes(L.ver)){
      S.decks[inc.id] = inc;
      if (inc.deleted) rep.updated.push(displayName(L) + " (deleted)"); else rep.updated.push(displayName(inc));
      continue;
    }
    if (L.deleted){ if (!inc.deleted){ S.decks[inc.id] = inc; rep.restored.push(displayName(inc)); } continue; }
    if (inc.deleted){ L.past.push(inc.ver); rep.kept.push(displayName(L)); continue; }
    const base = displayName(L).replace(/ [12]$/, "");
    const same = displayName(L) === displayName(inc);
    const mine = {...L, id: uid(), name: same ? base + " 1" : L.name};
    if (same) inc.name = base + " 2";
    S.decks[mine.id] = mine; S.decks[inc.id] = inc;
    if (S.active === inc.id) S.active = mine.id;
    rep.conflicts.push(base);
  }
  return rep;
}
function reportText(rep){
  const parts = [];
  if (rep.added.length) parts.push(`${rep.added.length} new deck${rep.added.length > 1 ? "s" : ""}: ${rep.added.join(", ")}`);
  if (rep.updated.length) parts.push(`${rep.updated.length} updated: ${rep.updated.join(", ")}`);
  if (rep.restored.length) parts.push(`${rep.restored.length} brought back because they were edited after you deleted them: ${rep.restored.join(", ")}`);
  if (rep.conflicts.length) parts.push(`${rep.conflicts.length} edited by both of you, so both versions were kept (same names get “1” for yours and “2” for theirs): ${rep.conflicts.join(", ")}`);
  if (rep.kept.length) parts.push(`${rep.kept.length} deleted in the file but you edited them since, so they were kept: ${rep.kept.join(", ")}`);
  return parts;
}

/* ---------------- Board animation: cards glide to their new place (FLIP) ---------------- */
function snapshot(){
  const m = new Map(), vh = innerHeight;
  document.querySelectorAll("#board .cw[data-uid]").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.bottom > -40 && r.top < vh + 40) m.set(el.dataset.uid, {r, zone: el.closest(".panel").dataset.zone, src: el.querySelector(".ct img")?.src});
  });
  return m;
}
function animateBoard(fn, opts = {}){
  if (REDUCED.matches || $("#board").hidden){ fn(); return; }
  const before = snapshot();
  fn();
  const vh = innerHeight; let n = 0;
  document.querySelectorAll("#board .cw[data-uid]").forEach(el => {
    if (n > 140) return;
    const r = el.getBoundingClientRect();
    if (r.bottom < -40 || r.top > vh + 40) return;
    const u = el.dataset.uid, b = before.get(u);
    if (b){
      const dx = b.r.left - r.left, dy = b.r.top - r.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      n++;
      if (b.zone !== el.closest(".panel").dataset.zone && b.src){
        // across the divider: fly a copy above both panels so it isn't clipped
        const ct = el.querySelector(".ct"), cr = ct.getBoundingClientRect();
        const fly = document.createElement("img"); fly.src = b.src; fly.className = "fly";
        Object.assign(fly.style, {left: cr.left + "px", top: cr.top + "px", width: cr.width + "px", height: cr.height + "px"});
        document.body.appendChild(fly); el.style.visibility = "hidden";
        const sx = b.r.width / r.width;
        const a = fly.animate([{transform: `translate(${b.r.left - cr.left}px,${b.r.top - cr.top}px) scale(${sx})`}, {transform: "none"}], {duration: 360, easing: EASE});
        a.onfinish = a.oncancel = () => { fly.remove(); el.style.visibility = ""; };
      } else el.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: "none"}], {duration: 300, easing: EASE});
    } else if (opts.added && opts.added.includes(u)){
      n++; el.animate([{opacity: 0, transform: "scale(.9) translateY(8px)"}, {opacity: 1, transform: "none"}], {duration: 260, easing: EASE});
    }
  });
}

/* ---------------- EDHREC type suggestions ----------------
   1. Find the EDHREC theme for this commander whose card lists best match your cards.
   2. Use that theme's average type counts (or the commander's overall average), with basics vs other lands.
   3. Adjust lands for your mana curve versus the typical deck's curve.
   4. Keep the total at 100 with your commander(s). */
const SUGG = {};
function suggestKey(d){
  const names = d.cards.filter(c => c.zone === "deck").map(c => c.card.name).sort();
  return cmdKey(d) + "|" + names.length + "|" + names.join(",").length + "|" + names.slice(0, 40).join(",");
}
function curveAvg(curve){
  let n = 0, sum = 0;
  for (const [k, v] of Object.entries(curve || {})){ n += v; sum += (+k) * v; }
  return n ? sum / n : null;
}
async function loadSuggestion(d, key){
  SUGG[key] = {loading: true};
  try {
    const {j: base, path} = await cmdPage(d);
    if (!base) throw new Error(`EDHREC has no data for ${cmdKey(d)} yet.`);
    const totalDecks = base.container?.json_dict?.card?.num_decks || base.num_decks_avg || 0;
    const tags = ((base.panels && base.panels.taglinks) || []).slice(0, 10);
    const ours = new Set(d.cards.map(c => c.card.name));
    let best = null;
    if (ours.size >= 6 && tags.length){
      const pages = await Promise.all(tags.map(t => edh(`${path}/${t.slug}`)));
      pages.forEach((pg, i) => {
        if (!pg) return;
        const seen = new Set(); let score = 0, hits = 0;
        for (const l of edhLists(pg)) for (const cv of l.cardviews || []){
          if (seen.has(cv.name) || !ours.has(cv.name)) continue;
          seen.add(cv.name); hits++; score += Math.max(0, cv.synergy || 0) + 0.03;
        }
        if (hits >= 3 && score >= 0.3 && (!best || score > best.score)) best = {tag: tags[i], page: pg, score, hits};
      });
    }
    const src = best ? best.page : base;
    const counts = {};
    for (const t of TYPES) counts[t] = Math.max(0, Math.round(src[t.toLowerCase()] ?? 0));
    let landNote = "";
    const spells = d.cards.filter(c => c.zone === "deck" && c.bucket !== "Land");
    const avgE = curveAvg(src.panels && src.panels.mana_curve) ?? curveAvg(base.panels && base.panels.mana_curve);
    if (avgE != null && spells.length >= 10){
      const avgO = spells.reduce((a, c) => a + (c.card.cmc || 0), 0) / spells.length;
      const adj = Math.max(-3, Math.min(3, Math.round((avgO - avgE) * 3)));
      if (adj){
        counts.Land += adj;
        landNote = ` ${adj > 0 ? "+" : ""}${adj} land${Math.abs(adj) > 1 ? "s" : ""} because your spells cost ${avgO.toFixed(1)} on average versus ${avgE.toFixed(1)} in those decks.`;
      }
    }
    let diff = (100 - cmdrs(d).length) - Object.values(counts).reduce((a, b) => a + b, 0);
    const nonland = TYPES.filter(t => t !== "Land");
    let guard = 200;
    while (diff !== 0 && guard--){
      const pool = nonland.filter(t => diff > 0 || counts[t] > 0).sort((a, b) => counts[b] - counts[a]);
      const t = pool[0] || "Land";
      counts[t] += Math.sign(diff); diff -= Math.sign(diff);
    }
    // basics vs other lands, scaled to the suggested land count
    const sb = src.basic ?? base.basic, sn = src.nonbasic ?? base.nonbasic;
    let basic = null, nonbasic = null;
    if (sb != null && sn != null && sb + sn > 0){ basic = Math.round(counts.Land * sb / (sb + sn)); nonbasic = counts.Land - basic; }
    const n = best ? best.tag.count : totalDecks;
    const who = d.partner ? cmdKey(d) : d.commander.name.split(",")[0];
    const short = best ? `From ${(+n || 0).toLocaleString()} “${best.tag.value}” decks` : `From ${(+n || 0).toLocaleString()} ${who} decks`;
    const why = best
      ? `Your deck matches EDHREC’s “${best.tag.value}” ${cmdKey(d)} decks best (${best.hits} of your cards are typical there). These are their average type counts.${landNote}`
      : `Average type counts across ${(+n || 0).toLocaleString()} ${cmdKey(d)} decks on EDHREC.${ours.size < 6 ? " Add a few more cards and the suggestion will match your deck’s theme." : ""}${landNote}`;
    SUGG[key] = {counts, basic, nonbasic, short: short + (landNote ? " · lands adjusted" : ""), why};
  } catch (err){
    SUGG[key] = {loading: true, error: err.message || "Couldn’t reach EDHREC."};
    setTimeout(() => { if (SUGG[key] && SUGG[key].error) delete SUGG[key]; }, 15000);
  }
  if (cur() === d) renderStats();
}
/* Split basics by how many colored mana symbols your deck's spells use. */
function basicSplit(d, n){
  const ci = deckCI(d); if (!ci.length) return [{name: "Wastes", count: n}];
  const w = Object.fromEntries(ci.map(x => [x, 0]));
  for (const c of d.cards) if (c.zone === "deck" && c.bucket !== "Land") for (const m of String(c.card.mana).matchAll(/\{([^}]+)\}/g)) for (const x of ci) if (m[1].includes(x)) w[x]++;
  let tot = Object.values(w).reduce((a, b) => a + b, 0);
  if (!tot){ ci.forEach(x => w[x] = 1); tot = ci.length; }
  const raw = ci.map(x => ({x, f: n * w[x] / tot}));
  const out = raw.map(r => ({x: r.x, count: Math.floor(r.f), rem: r.f % 1}));
  let left = n - out.reduce((a, b) => a + b.count, 0);
  out.sort((a, b) => b.rem - a.rem).forEach(o => { if (left > 0){ o.count++; left--; } });
  return out.filter(o => o.count > 0).map(o => ({name: BASIC_OF[o.x], count: o.count}));
}

function sortVal(c, m){
  switch (UI.sort){
    case "incl": { const s = statFor(m, c.card.name); return s ? -s.incl : 1; }
    case "syn": { const s = statFor(m, c.card.name); return s && s.syn != null ? -s.syn : 9; }
    case "price": { const p = priceOf(c.card); return p ? -p.v : 1; }
    case "cheap": { const p = priceOf(c.card); return p ? p.v : 1e9; }
    case "cmc": return c.card.cmc || 0;
    case "name": return c.card.name.toLowerCase();
    case "ctype": return (subtypes(c.card)[0] || "~").toLowerCase() + "|" + c.card.name.toLowerCase();
    default: return 0;
  }
}
/* Locked cards always come first; within each group, your order or the chosen sort. */
function zoneItems(d, zone, t){
  const items = d.cards.filter(c => c.zone === zone && c.bucket === t);
  const m = edhStats(d);
  const keyed = items.map((c, i) => ({c, i, k: UI.sort === "manual" ? 0 : sortVal(c, m)}));
  keyed.sort((a, b) => (b.c.locked - a.c.locked) || (a.k < b.k ? -1 : a.k > b.k ? 1 : 0) || a.i - b.i);
  return keyed.map(x => x.c);
}

function boxHTML(d, zone, t){

  } else count = `<span class="box-count">${filtering ? `${shownN} of ` : ""}${total}</span>`;

      <i class="ms ${MS[t]}"></i><h3>${PLURAL[t]}</h3><span class="box-right">${lk ? `<span class="box-lk" title="${lk} locked">${I.lock}${lk}</span>` : ""}${count}<span class="box-fold" aria-hidden="true">${I.down}</span></span></div>
    <div class="grid">${tiles}<button class="add-tile" data-add="${t}" data-side="${zone}"><span class="card-plus-ico">+</span>Add ${PLURAL[t].toLowerCase()}</button></div></div>`;
}
/* Tokens: not part of the 100, no limits, no EDHREC. One tile per artwork with a count, like basic lands. */
const tokZone = k => k.zone || "deck";
/* The same token across printings: same name and power/toughness, and the same rules text once wording
   like "Sacrifice this artifact" vs "this token" is ignored (missing text counts as a match). */
const normTokText = s => String(s || "").toLowerCase().replace(/this (artifact|creature|token|permanent|enchantment)/g, "this").replace(/\s+/g, " ").trim();
const tokKey = c => `${String(c.name).toLowerCase()}|${c.pt || ""}|${normTokText(c.text)}`;
function sameToken(a, b){
  if (String(a.name).toLowerCase() !== String(b.name).toLowerCase() || (a.pt || "") !== (b.pt || "")) return false;
  const x = normTokText(a.text), y = normTokText(b.text);
  return !x || !y || x === y;
}
function tokenBoxHTML(d, zone){

      <div class="ct" data-img="${esc(largeOf(k.card))}" title="${esc(k.card.custom && k.card.custom.name ? k.card.custom.name + " (" + k.card.name + ")" : k.card.name)}"><span class="ct-name">${esc(k.card.name)}</span>
        ${k.card.custom ? `<span class="custom-tag" title="Custom art or name">${I.brush}</span>` : ""}

      <div class="ct-stats"><div class="st-row faint">${esc(String(k.card.pt || k.card.type.replace(/^Token\s*/, "")).slice(0, 40))}</div></div>
      <div class="acts"><button data-tact="edit" title="Edit art and name">${I.brush}</button><button class="del" data-tact="remove" title="Remove token">${I.trash}</button></div></div>`).join("");
  return `<div class="box tokens${folded ? " collapsed" : ""}" data-type="Token" data-zone="${zone}">
    <div class="box-head" data-fold="${fk}" title="${folded ? "Show" : "Hide"} tokens"><span class="box-grip" style="visibility:hidden"></span>
      <i class="ms ms-token"></i><h3>Tokens</h3><span class="box-right"><button class="pill-btn" data-tokfind="${zone}" title="Find the tokens your deck's cards make">Find for my deck</button><span class="box-count">${sumQ(toks)}</span><span class="box-fold" aria-hidden="true">${I.down}</span></span></div>
    <div class="grid">${tiles}<button class="add-tile" data-addtoken="${zone}"><span class="card-plus-ico">+</span>Add tokens</button></div></div>`;

/* Adding always makes a new token card, so each can get its own art; use its count for copies. */
function addToken(card, zone, keep){
  const d = cur(); if (!d || guard(d)) return null;
  d.tokens = d.tokens || [];
  const k = {uid: uid(), card: keep ? JSON.parse(JSON.stringify(card)) : plainPrint(card), qty: 1, zone: zone || A.side || "deck"};
  d.tokens.push(k); revealAfterAdd = k.uid;
